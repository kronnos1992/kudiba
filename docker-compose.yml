services:
  # ============================================================================
  # 1. PERÍMETRO & ENTRYPOINT (GATEWAY)
  # ============================================================================
  gateway:
    build:
      context: ./Backend/gateway
      dockerfile: Dockerfile
    container_name: kudiba-api-gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - GATEWAY_PORT=8080
      - GATEWAY_ENV=development
      - REDIS_HOST=gateway-redis
      - REDIS_PORT=6379
      - CORE_API_URL=http://core-api:8081
      - AUTH_SERVICE_URL=http://auth-service:8082
      - FISCAL_ENGINE_URL=http://fiscal-engine:9090
      - FISCAL_ENGINE_GRPC_TARGET=http://fiscal-engine:9090
      # Sondas TCP do endpoint /health/services
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - JWT_SECRET=kudiba_jwt_secret_development_key_change_in_production_2026
      - AGT_CONTINGENCY_MAX_DAYS=60
    depends_on:
      gateway-redis:
        condition: service_healthy
    networks:
      - kudiba-perimeter-network
      - kudiba-internal-network

  # ============================================================================
  # 2. MOTOR DE FACTURAÇÃO & FISCAL ENGINE (RUST / AXUM + TONIC)
  # Conformidade: Decreto Presidencial n.º 71/25 (AGT Angola)
  # ============================================================================
  invoicing:
    # O contexto é a raiz do monorepo: o build.rs compila o contrato gRPC partilhado
    build:
      context: .
      dockerfile: Backend/services/KudibaInvoicing/Dockerfile
    container_name: kudiba-invoicing
    restart: unless-stopped
    # Sem `ports:` — o motor fiscal é alcançável apenas pela rede interna
    # (alias `fiscal-engine`), nunca a partir do perímetro. As rotas fiscais
    # dependem dos headers X-Resolved-* injectados pelo Gateway, que o serviço
    # não valida por conta própria.
    environment:
      - PORT=9090
      - GRPC_PORT=9091
      - RUST_LOG=info,kudiba_invoicing=debug
      - DATABASE_URL=postgres://kudiba:kudiba_secret_pass@postgres:5432/kudiba_invoicing
      # Chave privada RSA-2048 registada na AGT (em produção exige chave oficial)
      - AGT_RSA_PRIVATE_KEY_PEM=
      - AGT_RSA_PRIVATE_KEY_PATH=
      - AGT_PLATFORM_URL=https://webservices.agt.minfin.gov.ao/facturacao-electronica
      - ENVIRONMENT=development
      - AGT_KEY_VERSION=1
      - DB_MAX_CONNECTIONS=20
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      kudiba-internal-network:
        aliases:
          - fiscal-engine
          - kudiba-invoicing

  # ============================================================================
  # 3. MICROSSERVIÇO DE AUTENTICAÇÃO & RBAC (PYTHON / FASTAPI)
  # ============================================================================
  auth:
    build:
      context: ./Backend/services/KudibaAuth
      dockerfile: Dockerfile
    container_name: kudiba-auth
    restart: unless-stopped
    environment:
      - PORT=8082
      - ENVIRONMENT=development
      - DATABASE_URL=postgresql+asyncpg://kudiba:kudiba_secret_pass@postgres:5432/kudiba_auth
      - REDIS_URL=redis://gateway-redis:6379/0
      - JWT_SECRET=kudiba_jwt_secret_development_key_change_in_production_2026
      - JWT_ACCESS_EXPIRATION_MINUTES=15
      - REFRESH_TOKEN_EXPIRATION_DAYS=7
    depends_on:
      postgres:
        condition: service_healthy
      gateway-redis:
        condition: service_healthy
    networks:
      kudiba-internal-network:
        aliases:
          - auth-service
          - kudiba-auth

  # ============================================================================
  # 3. ESTADO EFÊMERO & CACHE PERIMÉTRICO (REDIS 7+)
  # ============================================================================
  gateway-redis:
    image: redis:7.4-alpine
    container_name: kudiba-gateway-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "volatile-lru"]
    ports:
      - "6379:6379"
    volumes:
      - redis_gateway_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - kudiba-perimeter-network
      - kudiba-internal-network

  # ============================================================================
  # 3. BASE DE DADOS TRANSACIONAL ACID (POSTGRESQL 16+)
  # Profile: "full", "infra"
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: kudiba-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=kudiba_erp
      - POSTGRES_USER=kudiba
      - POSTGRES_PASSWORD=kudiba_secret_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./Backend/deploy/00-init-databases.sh:/docker-entrypoint-initdb.d/00-init.sh:ro
      - ./Backend/deploy/01-invoicing-schema.sql:/docker-entrypoint-initdb.d/01-invoicing-schema.sql:ro
      - ./Backend/deploy/02-auth-schema.sql:/docker-entrypoint-initdb.d/02-auth-schema.sql:ro
      - ./Backend/deploy/03-retire-demo-admin.sql:/docker-entrypoint-initdb.d/03-retire-demo-admin.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kudiba -d kudiba_erp"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - kudiba-internal-network

  # ============================================================================
  # 4. MESSAGE BROKER & FILAS DE TAREFAS (RABBITMQ COM MANAGEMENT UI)
  # Profile: "full", "messaging"
  # ============================================================================
  rabbitmq:
    profiles: ["full", "messaging"]
    image: rabbitmq:3.13-management-alpine
    container_name: kudiba-rabbitmq
    restart: unless-stopped
    environment:
      - RABBITMQ_DEFAULT_USER=kudiba
      - RABBITMQ_DEFAULT_PASS=kudiba_rabbit_pass
    ports:
      - "5672:5672"    # AMQP Protocol
      - "15672:15672"  # Management Web UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kudiba-internal-network


  # ============================================================================
  # 5. EVENT STREAMING & AUDIT LOG (REDPANDA - KAFKA API COMPATIBLE)
  # Profile: "streaming"
  # ============================================================================
  kafka:
    profiles: ["streaming"]
    image: docker.redpanda.com/redpandadata/redpanda:v24.1.8
    container_name: kudiba-kafka
    restart: unless-stopped
    command:
      - redpanda start
      - --smp 1
      - --memory 512M
      - --overprovisioned
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://kafka:9092,external://localhost:19092
    ports:
      - "19092:19092"
      - "9644:9644" # Admin API
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    networks:
      - kudiba-internal-network

networks:
  kudiba-perimeter-network:
    driver: bridge
  kudiba-internal-network:
    driver: bridge

volumes:
  redis_gateway_data:
  postgres_data:
  rabbitmq_data:
  redpanda_data:
