name: Docker Build & Publish (Docker Hub)

on:
  push:
    branches: [ main, master, develop, 'gateway/**', 'auth/**', 'invoicing/**', 'inventory/**', 'treasury/**', 'accounting/**', 'payroll/**', 'frontend/**' ]
    paths:
      - 'docker-compose.yml'
      - 'Backend/**'
      - 'Frontend/**'
      - 'proto/**'
      - '.github/workflows/docker.yml'
  pull_request:
    branches: [ main, master, develop, 'gateway/**', 'auth/**', 'invoicing/**', 'inventory/**', 'treasury/**', 'accounting/**', 'payroll/**', 'frontend/**' ]
    paths:
      - 'docker-compose.yml'
      - 'Backend/**'
      - 'Frontend/**'
      - 'proto/**'
      - '.github/workflows/docker.yml'

env:
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
  POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
  POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
  KUDIBA_APP_PASSWORD: ${{ secrets.KUDIBA_APP_PASSWORD }}
  JWT_SECRET: ${{ secrets.JWT_SECRET }}
  RABBITMQ_DEFAULT_USER: ${{ secrets.RABBITMQ_DEFAULT_USER }}
  RABBITMQ_DEFAULT_PASS: ${{ secrets.RABBITMQ_DEFAULT_PASS }}
  AGT_RSA_PRIVATE_KEY_PEM: ${{ secrets.AGT_RSA_PRIVATE_KEY_PEM }}
  BOOTSTRAP_SYSADMIN_EMAIL: ${{ secrets.BOOTSTRAP_SYSADMIN_EMAIL }}
  BOOTSTRAP_SYSADMIN_PASSWORD: ${{ secrets.BOOTSTRAP_SYSADMIN_PASSWORD }}
  INTEGRATION_ENCRYPTION_KEY: ${{ secrets.INTEGRATION_ENCRYPTION_KEY }}

jobs:
  validate-docker:
    name: Validate Docker Compose Configuration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration (Default)
        run: docker compose config >/dev/null

      - name: Validate Docker Compose Configuration (Full Profile)
        run: docker compose --profile full config >/dev/null

      - name: Validate Docker Compose Configuration (Streaming Profile)
        run: docker compose --profile streaming config >/dev/null

  build-and-push-microservices:
    name: Build & Push (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: validate-docker
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: gateway
            image: kudiba-gateway
            context: ./Backend/gateway
            dockerfile: ./Backend/gateway/Dockerfile
          - service: invoicing
            image: kudiba-invoicing
            context: .
            dockerfile: ./Backend/services/KudibaInvoicing/Dockerfile
          - service: auth
            image: kudiba-auth
            context: ./Backend/services/KudibaAuth
            dockerfile: ./Backend/services/KudibaAuth/Dockerfile
          - service: inventory
            image: kudiba-inventory
            context: ./Backend/services/KudibaInventory
            dockerfile: ./Backend/services/KudibaInventory/Dockerfile
          - service: treasury
            image: kudiba-treasury
            context: ./Backend/services/KudibaTreasury
            dockerfile: ./Backend/services/KudibaTreasury/Dockerfile
          - service: accounting
            image: kudiba-accounting
            context: ./Backend/services/KudibaAccounting
            dockerfile: ./Backend/services/KudibaAccounting/Dockerfile
          - service: payroll
            image: kudiba-payroll
            context: ./Backend/services/KudibaPayroll
            dockerfile: ./Backend/services/KudibaPayroll/Dockerfile
          - service: integrations
            image: kudiba-integrations
            context: ./Backend/services/KudibaIntegrations
            dockerfile: ./Backend/services/KudibaIntegrations/Dockerfile
          - service: backoffice
            image: kudiba-backoffice
            context: ./Backend/services/KudibaBackoffice
            dockerfile: ./Backend/services/KudibaBackoffice/Dockerfile
          - service: frontend
            image: kudiba-frontend
            context: ./Frontend
            dockerfile: ./Frontend/Dockerfile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Check Docker Hub Credentials
        id: dockerhub_creds
        run: |
          if [ -n "${{ secrets.DOCKERHUB_USERNAME }}" ] && [ -n "${{ secrets.DOCKERHUB_TOKEN }}" ] && [ "${{ github.event_name }}" = "push" ] && ( [ "${{ github.ref_name }}" = "main" ] || [ "${{ github.ref_name }}" = "master" ] ); then
            echo "can_push=true" >> "$GITHUB_OUTPUT"
            echo "namespace=${{ secrets.DOCKERHUB_USERNAME }}" >> "$GITHUB_OUTPUT"
          else
            echo "can_push=false" >> "$GITHUB_OUTPUT"
            echo "namespace=kudiba" >> "$GITHUB_OUTPUT"
          fi

      - name: Login to Docker Hub
        if: steps.dockerhub_creds.outputs.can_push == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push ${{ matrix.image }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: ${{ steps.dockerhub_creds.outputs.can_push == 'true' }}
          tags: |
            ${{ steps.dockerhub_creds.outputs.namespace }}/${{ matrix.image }}:latest
            ${{ steps.dockerhub_creds.outputs.namespace }}/${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
