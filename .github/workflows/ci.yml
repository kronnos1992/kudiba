name: CI - Backend Services, Gateway & KudibaAuth

on:
  push:
    branches: [ main, master, develop, 'gateway/**', 'auth/**', 'invoicing/**', 'inventory/**', 'treasury/**', 'accounting/**', 'payroll/**' ]
    paths:
      - 'Backend/**'
      - 'Frontend/**'
      - 'scripts/test-e2e-flow.py'
      - 'proto/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [ main, master, develop, 'gateway/**', 'auth/**', 'invoicing/**', 'inventory/**', 'treasury/**', 'accounting/**', 'payroll/**' ]
    paths:
      - 'Backend/**'
      - 'Frontend/**'
      - 'scripts/test-e2e-flow.py'
      - 'proto/**'
      - '.github/workflows/ci.yml'

jobs:
  frontend-build:
    name: Frontend - Type Check & Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: Frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix Frontend

      - name: Build frontend
        run: npm --prefix Frontend run build

  rust-check-and-build:
    name: Rust - Check, Lint & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "Backend -> Backend/target"

      - name: Check code formatting
        working-directory: Backend
        run: cargo fmt --all --check

      - name: Run Cargo Check
        working-directory: Backend
        run: cargo check --verbose

      - name: Run Clippy Linter
        working-directory: Backend
        run: cargo clippy --all-targets -- -D warnings

      - name: Run Cargo Tests
        working-directory: Backend
        run: cargo test --workspace

  kudiba-auth-tests:
    name: KudibaAuth (Python) - Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: Backend/services/KudibaAuth
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Run pytest
        working-directory: Backend/services/KudibaAuth
        run: |
          PYTHONPATH=. python -m pytest tests/ -q

  kudiba-payroll-tests:
    name: KudibaPayroll (Python) - Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: Backend/services/KudibaPayroll
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Run pytest
        working-directory: Backend/services/KudibaPayroll
        run: |
          PYTHONPATH=. python -m pytest tests/ -q
