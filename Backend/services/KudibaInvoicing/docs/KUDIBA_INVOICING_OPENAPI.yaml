openapi: 3.1.0
info:
  title: KudibaInvoicing - Motor Fiscal e Microservico de Facturacao
  version: 1.0.0
  description: >
    Contrato do motor fiscal do ERP Kudiba, escrito em Rust (Axum + Tokio) com Clean Architecture,
    CQRS e Unit of Work sobre PostgreSQL 16 ACID.

    Este servico e interno ao cluster e e alcancavel pelo **API Gateway** (que aplica autenticacao JWT,
    resolucao de tenant, rate limiting e bloqueio de contingencia AGT). A integracao POS deve passar
    por um canal interno autorizado. Os ports REST/gRPC do microservico nao devem ser publicados no
    perimetro; os endpoints REST fiscais exigem identidade e roles injectadas pelo Gateway.

    ### Conformidade Regulatoria
    Conforme o **Decreto Presidencial n.o 71/25 de Angola (AGT)**:
    - Assinatura digital RSA 2048-bit PKCS#1 v1.5 com encadeamento de hash SHA-256.
    - 4 caracteres de controlo extraidos das posicoes 1a, 11a, 21a e 31a da assinatura Base64.
    - Bloqueio pessimista por serie fiscal (`SELECT ... FOR UPDATE`) garantindo sequencialidade estrita
      sem lacunas (*zero gaps*).
    - Imutabilidade das faturas com trigger `trg_protect_invoices` no PostgreSQL.

    ### Documentacao interactiva
    A interface de referencia da API e servida pelo **Scalar** em `/scalar` (ou `/docs`).
    A especificacao bruta fica disponivel em `/api-docs/openapi.yaml`.

    ### Contrato gRPC
    O servico expoe tambem o contrato `kudiba.fiscal.v1` (Tonic) na porta 9091:
    `SignDocument`, `VerifySignature`, `ValidateSeriesSequence` e `TriggerSaftGeneration`.

servers:
  - url: http://localhost:8080
    description: Atraves do API Gateway Kudiba (com middlewares de seguranca)
  - url: http://localhost:9090
    description: KudibaInvoicing directo (Rust - sem middlewares de Gateway)

tags:
  - name: Facturacao & Motor Fiscal
    description: Emissao, consulta e assinatura de documentos fiscais
  - name: Series Fiscais & Validacao
    description: Consistência de sequencia, assinatura directa e verificacao independente
  - name: SAF-T (AO) & Auditoria
    description: Exportacao de ficheiro mensal e anual SAF-T (AO) no schema oficial da AGT
  - name: Conector AGT & Facturacao Electronica
    description: Comunicacao em tempo real, liveness/heartbeat e despacho de lotes
  - name: Gestao Criptografica
    description: Geracao e validacao de chaves RSA-2048 para credenciacao AGT
  - name: Regimes Fiscais de IVA & Isenções
    description: Enquadramento fiscal por volume de faturação (Exclusão, Simplificado, Geral) e validação de isenções M00-M99
  - name: Observabilidade & Documentacao
    description: Health check e documentacao da API

paths:
  # ===========================================================================
  # EMISSAO E CONSULTA DE DOCUMENTOS FISCAIS
  # ===========================================================================
  /api/v1/invoices:
    post:
      summary: Emitir Fatura / Documento Fiscal com Assinatura Digital AGT
      description: >
        Emite um documento com relevancia fiscal (FT, FR, NC, ND) com bloqueio pessimista
        atomico da serie fiscal (`SELECT ... FOR UPDATE`), numeracao rigorosamente sequencial,
        calculo de IVA, encadeamento de hash SHA-256 e assinatura digital RSA 2048-bit.
      tags:
        - Facturacao & Motor Fiscal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IssueInvoiceRequest'
            example:
              tenantId: "a0000000-0000-0000-0000-000000000001"
              documentType: "FT"
              seriesCode: "KUD26"
              fiscalYear: 2026
              customerName: "Empresa de Transportes Sonangol EP"
              customerAddress: "Rua da Missão, 120"
              customerCity: "Luanda"
              customerCountry: "AO"
              customerNif: "5412345678"
              paymentMethods: ["TRANSFERENCIA"]
              currency: "AOA"
              lines:
                - productCode: "PROD-001"
                  description: "Licenciamento Kudiba ERP Cloud Anual"
                  quantity: 1
                  unitPrice: 500000.00
                  taxRate: 14.00
                - productCode: "SERV-002"
                  description: "Consultoria e Parametrizacao Fiscal AGT"
                  quantity: 10
                  unitPrice: 25000.00
                  taxRate: 14.00
      responses:
        '201':
          description: Documento fiscal emitido, assinado digitalmente e gravado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssueInvoiceResponse'
              example:
                invoiceId: "9c68dc2d-c1d8-4e5b-9a09-3794af2b549a"
                documentNumber: "FT KUD26/000001"
                sequenceNumber: 1
                netTotal: 750000.00
                taxTotal: 105000.00
                grossTotal: 855000.00
                hashSha256: "5e0af1859bb4a4c170fd3ec53980df5b4623277c59e88a7bab1e18795f5366da"
                signatureRsaBase64: ""
                validationChars: "etwU"
                issuedAt: "2026-10-03T00:00:00Z"
                systemEntryDate: "2026-10-03T10:11:11.175384Z"
                isContingency: false
        '400':
          $ref: '#/components/responses/BadRequestError'
        '409':
          description: Conflito de concorrencia na serie fiscal (emissao concorrente na mesma serie)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/fiscal/invoices:
    post:
      summary: Emitir Fatura (rota encaminhada pelo Gateway)
      description: >
        Alias de `POST /api/v1/invoices` mantido para as rotas fiscais do API Gateway
        (`/api/v1/fiscal/*`). Produz exactamente o mesmo documento fiscal.
      tags:
        - Facturacao & Motor Fiscal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IssueInvoiceRequest'
      responses:
        '201':
          description: Documento fiscal emitido e assinado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssueInvoiceResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/invoices/{id}:
    get:
      summary: Consultar Fatura por ID
      description: >
        Recupera os dados completos da fatura emitida, incluindo as linhas de artigo
        e o bloco de assinatura digital.
      tags:
        - Facturacao & Motor Fiscal
      parameters:
        - name: id
          in: path
          required: true
          description: Identificador UUID da fatura
          schema:
            type: string
            format: uuid
        - name: tenantId
          in: query
          required: false
          description: Tenant owner da fatura (validacao multi-empresa)
          schema:
            type: string
            format: uuid
            example: "a0000000-0000-0000-0000-000000000001"
      responses:
        '200':
          description: Detalhes completos da fatura
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceDetailResponse'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /api/v1/fiscal/invoices/{id}:
    get:
      summary: Consultar Fatura por ID (rota encaminhada pelo Gateway)
      tags:
        - Facturacao & Motor Fiscal
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: tenantId
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Detalhes completos da fatura
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceDetailResponse'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /api/v1/fiscal/invoices/{id}/cancel:
    post:
      summary: Anular Documento Fiscal com Emissão de Nota de Crédito (NC)
      description: >
        Anula uma fatura ou documento fiscal emitindo automaticamente uma Nota de Crédito (NC)
        retificativa em estrita conformidade com o Decreto Presidencial n.º 71/25 de Angola.
        As faturas originais são imutáveis; a Nota de Crédito referencia o documento original,
        estorna os valores de incidência e IVA, assina digitalmente com RSA-SHA256 e grava
        de forma atómica.
      tags:
        - Facturacao & Motor Fiscal
      security:
        - BearerAuth: []
          TenantHeaderAuth: []
          RoleHeaderAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - tenantId
                - reason
              properties:
                tenantId:
                  type: string
                  format: uuid
                reason:
                  type: string
                  description: Motivo legal e justificação da anulação/retificação.
                  example: "Anulação por desistência do cliente"
                seriesCode:
                  type: string
                  description: Código da série fiscal da NC. Se omitido, utiliza a série do documento original.
                  example: "NC26"
      responses:
        '201':
          description: Nota de Crédito emitida e fatura anulada com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  originalInvoiceId:
                    type: string
                    format: uuid
                  originalDocumentNumber:
                    type: string
                    example: "FT KUD26/000001"
                  creditNoteId:
                    type: string
                    format: uuid
                  creditNoteDocumentNumber:
                    type: string
                    example: "NC KUD26/000001"
                  amountRefunded:
                    type: number
                    example: 114000.00
                  validationChars:
                    type: string
                    example: "a8b2"
                  reason:
                    type: string
                  issuedAt:
                    type: string
                    format: date-time
        '400':
          $ref: '#/components/responses/BadRequestError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /api/v1/fiscal/invoices/{id}/pdf:
    get:
      summary: Descarregar Fatura em Formato Oficial PDF A4
      description: >
        Gera e descarrega o documento fiscal em formato PDF (A4) oficial nos termos
        do Decreto Presidencial n.º 71/25 de Angola, contendo o QR Code fiscal da AGT,
        os 4 caracteres de validação da assinatura digital e a menção legal obrigatória.
      tags:
        - Facturacao & Motor Fiscal
      security:
        - BearerAuth: []
          TenantHeaderAuth: []
          RoleHeaderAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: tenantId
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Ficheiro PDF gerado com sucesso
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '404':
          $ref: '#/components/responses/NotFoundError'

  /api/v1/fiscal/invoices/{id}/thermal:
    get:
      summary: Imprimir Talão Térmico de Venda (80mm) para POS
      description: >
        Gera a versão compacta do documento fiscal para impressoras térmicas de talões (80mm / 48 colunas),
        nos formatos PDF ou Texto (ESC/POS).
      tags:
        - Facturacao & Motor Fiscal
      security:
        - BearerAuth: []
          TenantHeaderAuth: []
          RoleHeaderAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: tenantId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: format
          in: query
          required: false
          description: Formato desejado (pdf ou text). Padrão é pdf.
          schema:
            type: string
            enum: [pdf, text]
            default: pdf
      responses:
        '200':
          description: Talão térmico gerado com sucesso
          content:
            application/pdf:
              schema:
                type: string
                format: binary
            text/plain:
              schema:
                type: string
        '404':
          $ref: '#/components/responses/NotFoundError'

  /api/v1/fiscal/invoices/{id}/qr:
    get:
      summary: Consultar Payload e Imagem do QR Code Fiscal da AGT
      description: >
        Retorna a string canónica do QR Code fiscal (AGT) e a sua representação vetorial em SVG.
      tags:
        - Facturacao & Motor Fiscal
      security:
        - BearerAuth: []
          TenantHeaderAuth: []
          RoleHeaderAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: tenantId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: format
          in: query
          required: false
          description: Formato de retorno (json, svg, ascii). Padrão é json.
          schema:
            type: string
            enum: [json, svg, ascii]
            default: json
      responses:
        '200':
          description: Dados do QR code fiscal
          content:
            application/json:
              schema:
                type: object
                properties:
                  documentNumber:
                    type: string
                  validationChars:
                    type: string
                  softwareCert:
                    type: string
                  qrPayload:
                    type: string
                  svg:
                    type: string
            image/svg+xml:
              schema:
                type: string
            text/plain:
              schema:
                type: string
        '404':
          $ref: '#/components/responses/NotFoundError'


  # ===========================================================================
  # CHAVE PUBLICA E OPERACOES CRIPTOGRAFICAS
  # ===========================================================================
  /api/v1/public-key:
    get:
      summary: Obter Chave Publica RSA da AGT
      description: >
        Retorna a chave publica RSA 2048-bit registada para validacao independente das
        assinaturas digitais dos documentos emitidos.
      tags:
        - Series Fiscais & Validacao
      responses:
        '200':
          description: Chave publica e metadados de criptografia
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicKeyResponse'
              example:
                keyVersion: "1"
                publicKeyPem: "-----BEGIN PUBLIC KEY-----\nMIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8A...\n-----END PUBLIC KEY-----\n"
                algorithm: "RSA-2048 / SHA-256 PKCS#1 v1.5"

  /api/v1/fiscal/public-key:
    get:
      summary: Obter Chave Publica RSA (rota encaminhada pelo Gateway)
      tags:
        - Series Fiscais & Validacao
      responses:
        '200':
          description: Chave publica e metadados de criptografia
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicKeyResponse'

  /api/v1/fiscal/series:
    post:
      summary: Abrir serie fiscal
      description: >
        Abre (ou recupera, de forma idempotente) a serie fiscal de um tenant, tipo de documento e
        ano. A emissao de documentos cria a serie automaticamente quando ainda nao existe.
      tags:
        - Series Fiscais & Validacao
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFiscalSeriesRequest'
            example:
              tenantId: "9f8c1a54-0d2e-4f6b-9a71-2c5d8e3f1b04"
              documentType: "FT"
              seriesCode: "KUD26"
              fiscalYear: 2026
      responses:
        '201':
          description: Serie fiscal aberta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FiscalSeriesOpenedResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'

  /api/v1/fiscal/sign:
    post:
      summary: Assinatura directa de documento em modo contingencia
      description: >
        Reconstroi e assina o buffer canonico AGT de um documento ja emitido por um terminal POS
        em modo contingencia fiscal, sem qualquer escrita na base de dados (equivalente ao RPC
        gRPC `SignDocument`).
      tags:
        - Series Fiscais & Validacao
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignDirectRequest'
            example:
              tenantId: "a0000000-0000-0000-0000-000000000001"
              documentNumber: "FT POS01/000042"
              invoiceDate: "2026-10-03"
              systemEntryDate: "2026-10-03T10:11:11"
              grossTotal: 855000.00
              previousHash: "5e0af1859bb4a4c170fd3ec53980df5b4623277c59e88a7bab1e18795f5366da"
              keyVersion: "1"
      responses:
        '200':
          description: Documento assinado com o bloco de assinatura fiscal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignDirectResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'

  /api/v1/fiscal/verify-signature:
    post:
      summary: Verificar assinatura de documento fiscal
      description: >
        Valida de forma independente a assinatura RSA de um documento contra o buffer canonico
        reconstruido e devolve os 4 caracteres de controlo (equivalente ao RPC gRPC
        `VerifySignature`).
      tags:
        - Series Fiscais & Validacao
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifySignatureRequest'
      responses:
        '200':
          description: Resultado da verificacao da assinatura
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifySignatureResponse'

  /api/v1/fiscal/validate-series:
    post:
      summary: Validar consistencia sequencial de uma serie fiscal
      description: >
        Confirma se a proxima sequencia e continua e nao contem lacunas (*gaps*),
        devolvendo a ultima sequencia registada e o ultimo hash encadeado
        (equivalente ao RPC gRPC `ValidateSeriesSequence`).
      tags:
        - Series Fiscais & Validacao
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidateSeriesSequenceRequest'
            example:
              tenantId: "a0000000-0000-0000-0000-000000000001"
              seriesCode: "KUD26"
              expectedSequence: 1
              documentYear: 2026
              documentType: "FT"
      responses:
        '200':
          description: Resultado da validacao de sequencia
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidateSeriesSequenceResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  # ===========================================================================
  # ENQUADRAMENTO FISCAL DE IVA & REGIMES TRIBUTÁRIOS
  # ===========================================================================
  /api/v1/fiscal/tax-regimes:
    get:
      summary: Listar Regimes de IVA do Catálogo Fiscal Angolano
      description: >
        Devolve os 3 regimes de IVA previstos no Código do IVA de Angola:
        Regime de Exclusão (< 25M AOA), Regime Simplificado (25M - 350M AOA, taxa 7%)
        e Regime Geral (> 350M AOA, taxa padrão 14% e taxas reduzidas).
      tags:
        - Regimes Fiscais de IVA & Isenções
      responses:
        '200':
          description: Catálogo de regimes fiscais de Angola
          content:
            application/json:
              schema:
                type: object
                properties:
                  regimes:
                    type: array
                    items:
                      type: object
                      properties:
                        regimeCode:
                          type: string
                          example: "GERAL"
                        displayName:
                          type: string
                          example: "Regime Geral do IVA"
                        minTurnover:
                          type: number
                          example: 350000000.00
                        maxTurnover:
                          type: number
                          nullable: true
                          example: null
                        standardRate:
                          type: number
                          example: 14.00
                        allowedRates:
                          type: array
                          items:
                            type: number
                          example: [0.0, 5.0, 7.0, 14.0]
                        requiresCreditNote:
                          type: boolean
                          example: true
                        isVatExempt:
                          type: boolean
                          example: false
                        allowsInputVatCredit:
                          type: boolean
                          example: true

  /api/v1/fiscal/tax-regime:
    post:
      summary: Resolver ou Atualizar Enquadramento Fiscal do Contribuinte
      description: >
        Calcula automaticamente o regime de IVA com base no volume anual de faturação
        ou fixa um enquadramento declarado expressamente na AGT (`MANUAL`).
      tags:
        - Regimes Fiscais de IVA & Isenções
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - tenantId
              properties:
                tenantId:
                  type: string
                  format: uuid
                  example: "a0000000-0000-0000-0000-000000000001"
                fiscalYear:
                  type: integer
                  example: 2026
                declaredRegimeCode:
                  type: string
                  enum: ["EXCLUSAO", "SIMPLIFICADO", "GERAL"]
                  example: "GERAL"
                persist:
                  type: boolean
                  default: true
      responses:
        '200':
          description: Regime fiscal resolvido com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  tenantId:
                    type: string
                    format: uuid
                  fiscalYear:
                    type: integer
                  regimeCode:
                    type: string
                  displayName:
                    type: string
                  source:
                    type: string
                    example: "AUTOMATIC"
                  annualTurnover:
                    type: number
                  standardRate:
                    type: number
                  previousRegimeCode:
                    type: string
                  regimeChanged:
                    type: boolean
                  allowedRates:
                    type: array
                    items:
                      type: number
                  isVatExempt:
                    type: boolean
                  allowsInputVatCredit:
                    type: boolean
                  resolvedAt:
                    type: string
                    format: date-time

  /api/v1/fiscal/tax-regime/{tenantId}:
    get:
      summary: Consultar Enquadramento Fiscal Ativo do Tenant
      tags:
        - Regimes Fiscais de IVA & Isenções
      parameters:
        - name: tenantId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Regime e limites de faturação do contribuinte
          content:
            application/json:
              schema:
                type: object
                properties:
                  tenantId:
                    type: string
                    format: uuid
                  regimeCode:
                    type: string
                  displayName:
                    type: string
                  source:
                    type: string
                  basisTurnover:
                    type: number
                  standardRate:
                    type: number
                  allowedRates:
                    type: array
                    items:
                      type: number
                  isVatExempt:
                    type: boolean
                  allowsInputVatCredit:
                    type: boolean
                  resolvedAt:
                    type: string
                    format: date-time
                    nullable: true
                  resolvedYear:
                    type: integer
                    nullable: true

  /api/v1/fiscal/tax-regime/{tenantId}/exemption-codes/{code}:
    get:
      summary: Validar Código de Isenção de IVA (M00-M99)
      description: >
        Verifica se o código de motivo de isenção de IVA (M00 a M99, ex.: M02, M04)
        é legalmente admissível no regime tributário em vigor para o sujeito passivo.
      tags:
        - Regimes Fiscais de IVA & Isenções
      parameters:
        - name: tenantId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: code
          in: path
          required: true
          schema:
            type: string
            example: "M04"
      responses:
        '200':
          description: Resultado da validação do código de isenção
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                  isValid:
                    type: boolean
                  description:
                    type: string
                  legalBasis:
                    type: string

  # ===========================================================================
  # OBSERVABILIDADE & DOCUMENTACAO
  # ===========================================================================
  /health:
    get:
      summary: Verificacao de Vida (Liveness Probe)
      tags:
        - Observabilidade & Documentacao
      responses:
        '200':
          description: Motor fiscal operacional
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                status: "healthy"
                service: "KudibaInvoicing"
                version: "1.0.0"
                framework: "Rust"
                regulation: "Decreto Presidencial n.º 71/25 (AGT Angola)"
                timestamp: "2026-10-03T12:00:00Z"

  /scalar:
    get:
      summary: Scalar API Reference (documentacao interactiva)
      description: >
        Referencia interactiva da API substituindo o antigo Swagger UI. Tambem disponible
        em `/docs`.
      tags:
        - Observabilidade & Documentacao
      responses:
        '200':
          description: Pagina HTML do Scalar API Reference
          content:
            text/html:
              schema:
                type: string

  /api-docs/openapi.yaml:
    get:
      summary: Especificacao OpenAPI 3.1 Bruta
      tags:
        - Observabilidade & Documentacao
      responses:
        '200':
          description: Ficheiro YAML da especificacao OpenAPI
          content:
            application/yaml:
              schema:
                type: string

  # ===========================================================================
  # SAF-T (AO) & FACTURACAO ELECTRONICA AGT
  # ===========================================================================
  /api/v1/fiscal/saft:
    get:
      summary: Exportar Ficheiro SAF-T (AO) Mensal ou Anual
      description: >
        Gera e descarrega o ficheiro XML de auditoria tributaria SAF-T (AO) v1.01_01
        em estrita conformidade com o Decreto Executivo n.º 385/20 e o Decreto Presidencial n.º 71/25.
      tags:
        - SAF-T (AO) & Auditoria
      parameters:
        - name: tenantId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: year
          in: query
          required: true
          schema:
            type: integer
            example: 2026
        - name: month
          in: query
          required: false
          description: Mes fiscal (1 a 12). Se omitido, exporta o ano fiscal completo.
          schema:
            type: integer
            minimum: 1
            maximum: 12
            example: 10
      responses:
        '200':
          description: Ficheiro XML SAF-T (AO) gerado com sucesso
          content:
            application/xml:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequestError'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/fiscal/saft/validate:
    post:
      summary: Validar ficheiro SAF-T (AO) contra o Schema Oficial XSD da AGT
      description: >
        Valida a estrutura sintática e semântica de um XML SAF-T (AO) contra
        o schema oficial XSD da AGT (Decreto Executivo n.º 385/20 e Decreto Presidencial n.º 71/25).
      tags:
        - SAF-T (AO) & Auditoria
      security:
        - BearerAuth: []
          TenantHeaderAuth: []
          RoleHeaderAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - xml_content
              properties:
                xml_content:
                  type: string
                  description: Conteúdo XML do ficheiro SAF-T (AO) a validar.
      responses:
        '200':
          description: Ficheiro SAF-T válido contra o Schema Oficial da AGT
          content:
            application/json:
              schema:
                type: object
                properties:
                  valid:
                    type: boolean
                    example: true
                  schema:
                    type: string
                    example: AO_1.01_01
                  message:
                    type: string
        '422':
          description: Violações detectadas contra o Schema Oficial XSD da AGT
          content:
            application/json:
              schema:
                type: object
                properties:
                  valid:
                    type: boolean
                    example: false
                  schema:
                    type: string
                    example: AO_1.01_01
                  error:
                    type: string

  /api/v1/fiscal/saft/jobs:
    post:
      summary: Enfileirar Geração Assíncrona de SAF-T (AO)
      description: >
        Enfileira a exportação do ficheiro SAF-T (AO) para processamento em background,
        evitando timeouts em volumes elevados de faturas.
      tags:
        - SAF-T (AO) & Auditoria
      security:
        - BearerAuth: []
          TenantHeaderAuth: []
          RoleHeaderAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - tenantId
                - fiscalYear
              properties:
                tenantId:
                  type: string
                  format: uuid
                fiscalYear:
                  type: integer
                  example: 2026
                fiscalMonth:
                  type: integer
                  nullable: true
                  example: 10
      responses:
        '202':
          description: Tarefa enfileirada com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  jobId:
                    type: string
                  status:
                    type: string
                    example: QUEUED
                  estimatedTime:
                    type: string
                    example: 30s

  /api/v1/fiscal/saft/jobs/{id}:
    get:
      summary: Consultar Estado do Trabalho de SAF-T (AO)
      description: >
        Retorna o estado corrente de um trabalho assíncrono de geração de SAF-T (QUEUED, PROCESSING, COMPLETED, FAILED).
      tags:
        - SAF-T (AO) & Auditoria
      security:
        - BearerAuth: []
          TenantHeaderAuth: []
          RoleHeaderAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Estado do trabalho obtido com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  job_id:
                    type: string
                  tenant_id:
                    type: string
                    format: uuid
                  fiscal_year:
                    type: integer
                  fiscal_month:
                    type: integer
                    nullable: true
                  status:
                    type: string
                    example: COMPLETED
                  filename:
                    type: string
                    nullable: true
                  invoice_count:
                    type: integer
                    nullable: true
                  total_gross:
                    type: string
                    nullable: true
                  error:
                    type: string
                    nullable: true
                  created_at:
                    type: string
                    format: date-time
                  completed_at:
                    type: string
                    format: date-time
                    nullable: true
        '404':
          description: Trabalho não encontrado

  /api/v1/fiscal/saft/jobs/{id}/download:
    get:
      summary: Descarregar Ficheiro XML de Trabalho SAF-T (AO) Concluído
      description: >
        Descarrega o ficheiro XML SAF-T (AO) gerado pelo trabalho assíncrono.
      tags:
        - SAF-T (AO) & Auditoria
      security:
        - BearerAuth: []
          TenantHeaderAuth: []
          RoleHeaderAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Ficheiro XML SAF-T (AO)
          content:
            application/xml:
              schema:
                type: string
        '202':
          description: O ficheiro ainda se encontra em processamento
        '404':
          description: Trabalho não encontrado
        '422':
          description: O trabalho terminou com falha

  /api/v1/fiscal/reports/tax:
    get:
      summary: Consultar mapa de IVA, retenções e imposto de selo
      description: >
        Agrega bases e IVA por taxa e apresenta valores de retenção/imposto de selo informados
        na emissão. NC é deduzida dos totais. Não calcula retenções ou imposto de selo.
      tags:
        - SAF-T (AO) & Auditoria
      parameters:
        - name: tenantId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: year
          in: query
          required: true
          schema:
            type: integer
        - name: month
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 12
        - name: format
          in: query
          required: false
          description: Formato de exportação do relatório (json, xlsx, pdf). Padrão é json.
          schema:
            type: string
            enum: [json, xlsx, excel, pdf]
            default: json
      responses:
        '200':
          description: Mapa fiscal por período no formato solicitado (JSON, Excel XLSX ou PDF A4)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FiscalReportResponse'
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
            application/pdf:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/BadRequestError'
        '403':
          description: Perfil não autorizado ou empresa diferente da identidade autenticada

  /api/v1/fiscal/reports/tax/excel:
    get:
      summary: Descarregar Mapa de IVA e Apuramento Fiscal em Excel (.xlsx)
      description: Exporta diretamente a folha de cálculo formatada para contabilistas e auditores.
      tags:
        - SAF-T (AO) & Auditoria
      parameters:
        - name: tenantId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: year
          in: query
          required: true
          schema:
            type: integer
        - name: month
          in: query
          required: false
          schema:
            type: integer
      responses:
        '200':
          description: Ficheiro XLSX gerado com sucesso
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary

  /api/v1/fiscal/reports/tax/pdf:
    get:
      summary: Descarregar Mapa de IVA e Apuramento Fiscal em PDF Oficial (A4)
      description: Exporta diretamente o documento PDF formatado em A4 para arquivo e impressão fiscal.
      tags:
        - SAF-T (AO) & Auditoria
      parameters:
        - name: tenantId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: year
          in: query
          required: true
          schema:
            type: integer
        - name: month
          in: query
          required: false
          schema:
            type: integer
      responses:
        '200':
          description: Ficheiro PDF gerado com sucesso
          content:
            application/pdf:
              schema:
                type: string
                format: binary

  /api/v1/fiscal/pos/reports/x:
    get:
      summary: Leitura X de Caixa / POS (X-Report)
      description: >
        Emite a Leitura de Controlo X intradiária para conferência de caixa e auditoria de vendas.
        Apresenta faturado acumulado, desdobramento de taxas de IVA, notas de crédito emitidas e
        meios de pagamento. Não fecha a caixa nem incrementa a numeração sequencial Z.
      tags:
        - Pontos de Venda (POS) & Memória Fiscal
      security:
        - BearerAuth: []
          TenantHeaderAuth: []
          RoleHeaderAuth: []
      parameters:
        - name: tenantId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: date
          in: query
          required: false
          description: Data do fecho fiscal (AAAA-MM-DD). Padrão é a data atual.
          schema:
            type: string
            format: date
        - name: posTerminalId
          in: query
          required: false
          description: Identificador do terminal/caixa POS
          schema:
            type: string
      responses:
        '200':
          description: Leitura X gerada com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PosDailyReport'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '403':
          description: Perfil não autorizado

  /api/v1/fiscal/pos/reports/x/thermal:
    get:
      summary: Descarregar Talão Térmico da Leitura X (80mm / ESC/POS)
      description: Exporta a Leitura X em PDF para bobina de 80mm ou texto ESC/POS a 48 colunas.
      tags:
        - Pontos de Venda (POS) & Memória Fiscal
      security:
        - BearerAuth: []
          TenantHeaderAuth: []
          RoleHeaderAuth: []
      parameters:
        - name: date
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: format
          in: query
          required: false
          description: Formato de saída ('pdf' para talão 80mm ou 'text' para ESC/POS)
          schema:
            type: string
            enum: [pdf, text]
            default: pdf
      responses:
        '200':
          description: Talão térmico da Leitura X gerado
          content:
            application/pdf:
              schema:
                type: string
                format: binary
            text/plain:
              schema:
                type: string

  /api/v1/fiscal/pos/reports/z:
    post:
      summary: Emitir Fecho Z Oficial de Caixa / POS (Z-Report)
      description: >
        Encerra oficialmente o dia fiscal ou turno do terminal POS em conformidade com o
        Decreto Presidencial n.º 71/25. Atribui uma numeração sequencial anual de Fecho Z (ex.: Z 2026/000001),
        congela os acumuladores fiscais diários de IVA, vendas, retenções e meios de pagamento,
        e grava o registo de forma imutável. Operação idempotente para a mesma data/terminal.
      tags:
        - Pontos de Venda (POS) & Memória Fiscal
      security:
        - BearerAuth: []
          TenantHeaderAuth: []
          RoleHeaderAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                tenantId:
                  type: string
                  format: uuid
                fiscalYear:
                  type: integer
                  example: 2026
                date:
                  type: string
                  format: date
                  example: "2026-10-07"
                posTerminalId:
                  type: string
                  example: "POS-01"
      responses:
        '201':
          description: Fecho Z emitido e gravado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PosDailyReport'
        '400':
          $ref: '#/components/responses/BadRequestError'

  /api/v1/fiscal/pos/reports/z/thermal:
    post:
      summary: Descarregar Talão Térmico Oficial do Fecho Z (80mm / ESC/POS)
      description: Emite o Fecho Z e retorna diretamente o talão fiscal térmico para impressão na impressora de balcão.
      tags:
        - Pontos de Venda (POS) & Memória Fiscal
      security:
        - BearerAuth: []
          TenantHeaderAuth: []
          RoleHeaderAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                tenantId:
                  type: string
                  format: uuid
                date:
                  type: string
                  format: date
                format:
                  type: string
                  enum: [pdf, text]
                  default: pdf
      responses:
        '201':
          description: Talão térmico oficial do Fecho Z
          content:
            application/pdf:
              schema:
                type: string
                format: binary
            text/plain:
              schema:
                type: string

  /api/v1/fiscal/agt/status:
    get:
      summary: Verificar Conectividade e Liveness com a AGT
      description: >
        Executa um teste de comunicacao (heartbeat) com o canal de webservices da AGT
        para medicao de latencia e determinacao de modo de contingencia fiscal.
      tags:
        - Conector AGT & Facturacao Electronica
      responses:
        '200':
          description: Estado da comunicacao com a AGT
          content:
            application/json:
              schema:
                type: object
                properties:
                  isOnline:
                    type: boolean
                  endpoint:
                    type: string
                  latencyMs:
                    type: integer
                  checkedAt:
                    type: string
                    format: date-time
                  contingencyActive:
                    type: boolean
                  message:
                    type: string

  /api/v1/fiscal/agt/sync:
    post:
      summary: Sincronizar / Despachar Lote de Faturas para a AGT
      description: >
        Despacha um lote de documentos emitidos e assinados localmente para os webservices
        oficiais da AGT em tempo real.
      tags:
        - Conector AGT & Facturacao Electronica
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - tenantId
                - fiscalYear
              properties:
                tenantId:
                  type: string
                  format: uuid
                fiscalYear:
                  type: integer
                  example: 2026
                fiscalMonth:
                  type: integer
                  example: 10
      responses:
        '200':
          description: Lote aceite e processado com protocolo AGT
          content:
            application/json:
              schema:
                type: object
                properties:
                  batchId:
                    type: string
                  protocolNumber:
                    type: string
                  status:
                    type: string
                  totalDocuments:
                    type: integer
                  acceptedCount:
                    type: integer
                  rejectedCount:
                    type: integer
                  processedAt:
                    type: string
                    format: date-time
        '400':
          $ref: '#/components/responses/BadRequestError'

  /api/v1/fiscal/keys/generate:
    post:
      summary: Gerar Novo Par de Chaves RSA-2048 para Credenciacao AGT
      description: >
        Utilitario administrativo que gera um par oficial de chaves RSA-2048 (PKCS#8 e X.509)
        para homologacao do software e do produtor de faturas junto da AGT.
      tags:
        - Gestao Criptografica
      responses:
        '201':
          description: Par de chaves RSA gerado com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  keySizeBits:
                    type: integer
                    example: 2048
                  privateKeyPem:
                    type: string
                  publicKeyPem:
                    type: string
                  instructions:
                    type: string

components:
  schemas:
    IssueInvoiceRequest:
      type: object
      required:
        - tenantId
        - documentType
        - seriesCode
        - fiscalYear
        - customerName
        - customerAddress
        - customerCity
        - customerCountry
        - paymentMethods
        - lines
      properties:
        tenantId:
          type: string
          format: uuid
          description: Identificador unico da empresa/organizacao emissora
        documentType:
          type: string
          enum: [FT, FR, FP, NC, ND, RC, GR, GT]
          description: Tipo de documento fiscal nos termos da AGT
          example: "FT"
        seriesCode:
          type: string
          description: Codigo identificador da serie documental (ex. KUD26, A, POS01)
          example: "KUD26"
        fiscalYear:
          type: integer
          description: Ano fiscal de emissao
          example: 2026
        customerName:
          type: string
          description: Nome ou razao social do adquirente
          example: "Empresa de Transportes Sonangol EP"
        customerAddress:
          type: string
          description: Morada fiscal do adquirente
        customerCity:
          type: string
          description: Município do adquirente
        customerCountry:
          type: string
          minLength: 2
          maxLength: 2
          description: Código de país ISO 3166-1 alpha-2
        customerNif:
          type: string
          description: NIF do adquirente ou 'Consumidor Final'
          default: "Consumidor Final"
          example: "5412345678"
        sourceDocumentNumber:
          type: string
          description: Obrigatório para NC e ND; identifica o documento original desta empresa
        paymentMethods:
          type: array
          minItems: 1
          items:
            type: string
          example: ["TRANSFERENCIA"]
        withholdingTotal:
          type: number
          minimum: 0
          description: Montante explícito de retenção na fonte. Se omitido, pode ser calculado automaticamente via `applyWithholding`.
        applyWithholding:
          type: boolean
          default: false
          description: Ativa o cálculo automático da Retenção na Fonte (6.5% padrão sobre serviços ou base líquida).
        withholdingRate:
          type: number
          description: Taxa personalizada de Retenção na Fonte (padrão 6.5%).
          example: 6.5
        stampDutyTotal:
          type: number
          minimum: 0
          description: Montante explícito de Imposto de Selo. Se omitido, pode ser calculado automaticamente via `applyStampDuty`.
        applyStampDuty:
          type: boolean
          default: false
          description: Ativa o cálculo automático do Imposto de Selo (1.0% geral ou 0.7% em recibos/FR).
        stampDutyRate:
          type: number
          description: Taxa personalizada de Imposto de Selo (ex.: 1.0 ou 0.7).
          example: 1.0
        currency:
          type: string
          default: "AOA"
          example: "AOA"
        isContingency:
          type: boolean
          default: false
        keyVersion:
          type: string
          default: "1"
        lines:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/InvoiceLineInput'

    InvoiceLineInput:
      type: object
      required:
        - productCode
        - description
        - quantity
        - unitPrice
        - taxRate
      properties:
        productCode:
          type: string
          example: "PROD-001"
        description:
          type: string
          example: "Licenciamento Kudiba ERP Cloud Anual"
        quantity:
          type: number
          format: double
          example: 1.0
        unitPrice:
          type: number
          format: double
          example: 500000.00
        discountAmount:
          type: number
          minimum: 0
          default: 0
          description: Desconto total aplicado à linha antes do cálculo do IVA
        taxRate:
          type: number
          format: double
          description: Taxa de IVA aplicada em percentagem (ex. 14.00, 5.00, 0.00)
          example: 14.00
        taxExemptionCode:
          type: string
          nullable: true
          description: Motivo legal de isencao AGT (M00 a M99) obrigatorio se a taxa de IVA for 0%
          example: null
        isService:
          type: boolean
          default: false
          description: Identifica se o item é prestação de serviço para incidência de retenção na fonte (6.5%)
          example: false

    IssueInvoiceResponse:
      type: object
      properties:
        invoiceId:
          type: string
          format: uuid
        documentNumber:
          type: string
          example: "FT KUD26/000001"
        sequenceNumber:
          type: integer
          example: 1
        netTotal:
          type: number
          format: double
          example: 750000.00
        taxTotal:
          type: number
          format: double
          example: 105000.00
        grossTotal:
          type: number
          format: double
          example: 855000.00
        withholdingTotal:
          type: number
        stampDutyTotal:
          type: number
        amountDue:
          type: number
          description: Total bruto mais imposto de selo menos retenção informada
        hashSha256:
          type: string
          description: Hash SHA-256 gerado pelo encadeamento criptografico do Decreto n.º 71/25
        signatureRsaBase64:
          type: string
          description: Assinatura digital RSA 2048-bit em Base64
        validationChars:
          type: string
          description: Os 4 caracteres de validacao impressos no documento (posicoes 1, 11, 21, 31)
          example: "etwU"
        issuedAt:
          type: string
          format: date-time
        systemEntryDate:
          type: string
          format: date-time
        isContingency:
          type: boolean

    InvoiceDetailResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        seriesId:
          type: string
          format: uuid
        documentNumber:
          type: string
        sequenceNumber:
          type: integer
        documentType:
          type: string
        issuerNif:
          type: string
          nullable: true
        issuerAddress:
          type: string
          nullable: true
        issuerCity:
          type: string
          nullable: true
        issuerCountry:
          type: string
          nullable: true
        customerName:
          type: string
        customerNif:
          type: string
        customerAddress:
          type: string
          nullable: true
        customerCity:
          type: string
          nullable: true
        customerCountry:
          type: string
          nullable: true
        sourceDocumentNumber:
          type: string
          nullable: true
        paymentMethods:
          type: array
          items:
            type: string
        currency:
          type: string
        netTotal:
          type: number
        taxTotal:
          type: number
        grossTotal:
          type: number
        withholdingTotal:
          type: number
        stampDutyTotal:
          type: number
        amountDue:
          type: number
        taxRegimeCode:
          type: string
        hashSha256:
          type: string
        signatureRsaBase64:
          type: string
        validationChars:
          type: string
        keyVersion:
          type: string
        isContingency:
          type: boolean
        issuedAt:
          type: string
          format: date-time
        systemEntryDate:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        lines:
          type: array
          items:
            $ref: '#/components/schemas/InvoiceLineDetail'

    InvoiceLineDetail:
      type: object
      properties:
        id:
          type: string
          format: uuid
        invoiceId:
          type: string
          format: uuid
        lineNumber:
          type: integer
        productCode:
          type: string
        description:
          type: string
        quantity:
          type: number
        unitPrice:
          type: number
        discountAmount:
          type: number
        taxRate:
          type: number
        taxExemptionCode:
          type: string
          nullable: true
        lineTotal:
          type: number

    FiscalReportResponse:
      type: object
      properties:
        tenantId:
          type: string
          format: uuid
        fiscalYear:
          type: integer
        fiscalMonth:
          type: integer
          nullable: true
        vat:
          type: array
          items:
            type: object
            properties:
              taxRate:
                type: number
              taxableBase:
                type: number
              taxAmount:
                type: number
        withholdingTotal:
          type: number
        stampDutyTotal:
          type: number

    CreateFiscalSeriesRequest:
      type: object
      required:
        - tenantId
        - documentType
        - seriesCode
        - fiscalYear
      properties:
        tenantId:
          type: string
          format: uuid
        documentType:
          type: string
          description: Sigla do tipo de documento (FT, FS, FR, NC, ND, RG, RA)
          example: "FT"
        seriesCode:
          type: string
          example: "KUD26"
        fiscalYear:
          type: integer
          format: int32
          example: 2026

    FiscalSeriesOpenedResponse:
      type: object
      properties:
        seriesId:
          type: string
          format: uuid

    SignDirectRequest:
      type: object
      required:
        - tenantId
        - documentNumber
        - invoiceDate
        - systemEntryDate
        - grossTotal
      properties:
        tenantId:
          type: string
          format: uuid
          description: Empresa autenticada que solicita a assinatura
        documentNumber:
          type: string
          example: "FT POS01/000042"
        invoiceDate:
          type: string
          description: Data de emissao (YYYY-MM-DD ou RFC 3339)
          example: "2026-10-03"
        systemEntryDate:
          type: string
          description: Instante de registo no sistema (YYYY-MM-DDTHH:MM:SS ou RFC 3339)
          example: "2026-10-03T10:11:11"
        grossTotal:
          type: number
          format: double
          example: 855000.00
        previousHash:
          type: string
          description: Hash do documento imediatamente anterior (vazio para o 1.o da serie)
        keyVersion:
          type: string
          default: "1"

    SignDirectResponse:
      type: object
      properties:
        documentNumber:
          type: string
        signatureBase64:
          type: string
        hashSha256:
          type: string
        validationChars:
          type: string
        signedAt:
          type: string
          format: date-time
        isContingency:
          type: boolean

    VerifySignatureRequest:
      type: object
      required:
        - documentNumber
        - signatureBase64
        - invoiceDate
        - systemEntryDate
        - grossTotal
      properties:
        documentNumber:
          type: string
        signatureBase64:
          type: string
          description: Assinatura digital completa em Base64
        invoiceDate:
          type: string
        systemEntryDate:
          type: string
        grossTotal:
          type: number
          format: double
        previousHash:
          type: string
        keyVersion:
          type: string
          default: "1"

    VerifySignatureResponse:
      type: object
      properties:
        isValid:
          type: boolean
        validationChars:
          type: string
        errorMessage:
          type: string

    ValidateSeriesSequenceRequest:
      type: object
      required:
        - tenantId
        - seriesCode
        - expectedSequence
        - documentYear
      properties:
        tenantId:
          type: string
          format: uuid
        seriesCode:
          type: string
          example: "KUD26"
        expectedSequence:
          type: integer
          format: int64
          description: Sequencia esperada (N + 1)
          example: 1
        documentYear:
          type: integer
          example: 2026
        documentType:
          type: string
          default: "FT"
          description: Tipo de documento fiscal da serie (por omissao FT)

    ValidateSeriesSequenceResponse:
      type: object
      properties:
        isValid:
          type: boolean
        lastRecordedSequence:
          type: integer
          format: int64
        lastDocumentHash:
          type: string
        isGapDetected:
          type: boolean

    PublicKeyResponse:
      type: object
      properties:
        keyVersion:
          type: string
          example: "1"
        publicKeyPem:
          type: string
          example: "-----BEGIN PUBLIC KEY-----\nMIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8A...\n-----END PUBLIC KEY-----\n"
        algorithm:
          type: string
          example: "RSA-2048 / SHA-256 PKCS#1 v1.5"

    HealthResponse:
      type: object
      required:
        - status
        - service
      properties:
        status:
          type: string
          example: "healthy"
        service:
          type: string
          example: "KudibaInvoicing"
        version:
          type: string
        framework:
          type: string
          example: "Rust"
        regulation:
          type: string
        timestamp:
          type: string
          format: date-time

    ProblemDetail:
      type: object
      required:
        - type
        - title
        - status
        - detail
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        code:
          type: string
          example: "FISCAL_ENGINE_ERROR"
        timestamp:
          type: string
          format: date-time

    PosDailyReport:
      type: object
      properties:
        reportType:
          type: string
          enum: [LEITURA_X, FECHO_Z]
          example: "FECHO_Z"
        tenantId:
          type: string
          format: uuid
        companyName:
          type: string
          example: "Kudiba Comercial & Servicos Lda"
        companyNif:
          type: string
          example: "5001234567"
        agtCertNumber:
          type: string
          example: "CERT-AGT-2026/0042"
        date:
          type: string
          format: date
          example: "2026-10-07"
        generatedAt:
          type: string
          format: date-time
        zReportSequence:
          type: integer
          example: 1
        zReportNumber:
          type: string
          example: "Z 2026/000001"
        posTerminalId:
          type: string
          example: "POS-01"
        firstDocumentNumber:
          type: string
          example: "FT KUD26/000001"
        lastDocumentNumber:
          type: string
          example: "FT KUD26/000042"
        invoicesCount:
          type: integer
          example: 42
        creditNotesCount:
          type: integer
          example: 2
        grossSalesTotal:
          type: number
          example: 1500000.00
        discountsTotal:
          type: number
          example: 50000.00
        creditNotesTotal:
          type: number
          example: 100000.00
        netSalesTotal:
          type: number
          example: 1350000.00
        vatTotal:
          type: number
          example: 189000.00
        withholdingTotal:
          type: number
          example: 0.00
        stampDutyTotal:
          type: number
          example: 5000.00
        finalTotal:
          type: number
          example: 1544000.00
        taxes:
          type: array
          items:
            type: object
            properties:
              taxRate:
                type: number
                example: 14.0
              taxableBase:
                type: number
                example: 1000000.00
              taxAmount:
                type: number
                example: 140000.00
        payments:
          type: array
          items:
            type: object
            properties:
              paymentMethod:
                type: string
                example: "NU"
              paymentMethodName:
                type: string
                example: "Numerário (Cash)"
              totalAmount:
                type: number
                example: 544000.00
              transactionCount:
                type: integer
                example: 25

    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          example: "Invoice must have at least one line item."

  responses:
    BadRequestError:
      description: Requisicao invalida ou parametros ausentes
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    NotFoundError:
      description: Documento fiscal nao encontrado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    InternalError:
      description: Falha na emissao fiscal
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'