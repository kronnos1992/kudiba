[package]
name = "kudiba-hardware-bridge"
version = "0.1.0"
edition = "2021"
authors = ["Equipa de Arquitetura Kudiba <engenharia@kudiba.ao>"]
description = "Agente local de hardware POS do ERP Kudiba (ESC/POS, gaveta e fila durável)"
publish = false

[lib]
name = "kudiba_hardware_bridge"
path = "src/lib.rs"

[dependencies]
tokio = { version = "1.40", features = ["net", "io-util", "time", "rt", "macros", "sync"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.10", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
async-trait = "0.1"
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1.40", features = ["full"] }
