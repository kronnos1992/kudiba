[package]
name = "kudiba-hardware-bridge"
version = "0.1.0"
edition = "2021"
authors = ["Equipa de Arquitetura Kudiba <engenharia@kudiba.ao>"]
description = "Agente local de hardware POS do ERP Kudiba (ESC/POS, gaveta e fila durável)"
publish = false

[lib]
name = "kudiba_hardware_bridge"
path = "src/lib.rs"

[dependencies]
tokio = { version = "1.40", features = ["full"] }
axum = { version = "0.8", features = ["macros"] }
tower-http = { version = "0.6", features = ["cors"] }
subtle = "2"
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.10", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
rust_decimal = { version = "1", features = ["serde"] }
thiserror = "2"
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rusqlite = { version = "0.32", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serialport = { version = "4", default-features = false }
rusb = { version = "0.9", features = ["vendored"] }
axum-server = { version = "0.7", features = ["tls-rustls"] }
rustls-pemfile = "2"
kudiba-gateway-signature = { path = "../../gateway_signature" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Graphics_Printing", "Win32_System_SystemServices"] }

[dev-dependencies]
tokio = { version = "1.40", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
