          items:
            $ref: '#/components/schemas/TreasuryReceiptLineResponse'
  parameters:
    CorrelationIdHeader:
      name: X-Correlation-ID
      in: header
      description: Identificador de rastreamento distribuído (propagado através dos
        serviços).
      required: false
      schema:
        type: string
        format: uuid
    TenantHeader:
      name: X-Tenant-ID
      in: header
      description: Identificador do Tenant (UUID v4) para orquestração multi-empresa.
      required: true
      schema:
        type: string
        format: uuid
        example: a0000000-0000-0000-0000-000000000001
    IdempotencyKeyHeader:
      name: Idempotency-Key
      in: header
      description: Chave de idempotência para prevenção de faturas duplicadas.
      required: false
      schema:
        type: string
        example: fatura-venda-001
  responses:
    BadRequestError:
      description: Requisição inválida ou parâmetros ausentes
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    UnauthorizedError:
      description: Autenticação ausente ou inválida
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
