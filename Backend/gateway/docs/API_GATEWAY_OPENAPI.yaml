openapi: 3.1.0
info:
  title: Kudiba ERP - API Gateway & Motor Fiscal
  version: 1.0.0
  description: "API Gateway de entrada e orquestração perimétrica do ERP Kudiba em\
    \ Rust, integrado com o microserviço de facturação e motor fiscal KudibaInvoicing\
    \ (Rust / Axum + Tonic).\n### Conformidade Regulatória Conforme o **Decreto Presidencial\
    \ n.º 71/25 de Angola (AGT)**: - Assinatura digital RSA 2048-bit PKCS#1 v1.5 com\
    \ encadeamento de hash SHA-256. - 4 caracteres de controlo extraídos das posições\
    \ 1ª, 11ª, 21ª e 31ª da assinatura. - Bloqueio pessimista por série fiscal garantindo\
    \ sequencialidade estrita sem lacunas (*zero gaps*). - Imutabilidade de faturas\
    \ com trigger no PostgreSQL.\n### Autenticação no Swagger Clique no botão verde\
    \ **Authorize** no topo direito e insira: 1. **BearerAuth:** `Bearer <token>`\
    \ (ou apenas `<token>`).\n   - Token de Desenvolvimento Pré-Gerado (válido para\
    \ testes locais):\n   `eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiJ1c2VyLWFkbWluLWRlbW8iLCJ0ZW5hbnRfaWQiOiJhMDAwMDAwMC0wMDAwLTAwMDAtMDAwMC0wMDAwMDAwMDAwMDEiLCJicmFuY2hfaWQiOiJzZWRlLWx1YW5kYSIsInJvbGVzIjpbIkFETUlOIiwiT1BFUkFUT1IiLCJGSVNDQUxfQVVESVRPUiJdLCJleHAiOjIwODk4ODE2MDAsImp0aSI6ImRldi10b2tlbi1rdWRpYmEtMjAyNiJ9.6cn5UXJeLTv3tRFBq-6xOFK3_LtgBtpTI41ppXcGcR0`\n\
    2. **TenantHeader:** `a0000000-0000-0000-0000-000000000001`\n"
  contact:
    name: Equipa de Engenharia Kudiba
    email: engenharia@kudiba.ao
servers:
- url: http://localhost:8080
  description: API Gateway Local (Desenvolvimento / Docker)
- url: http://localhost:9090
  description: KudibaInvoicing Direto (Rust - Sem Middlewares de Gateway)
paths:
  /api/v1/invoices:
    post:
      summary: Emitir Fatura / Documento Fiscal com Assinatura Digital AGT
      description: 'Emite um novo documento com relevância fiscal (FT, FR, NC, ND)
        com bloqueio pessimista atômico da série fiscal (`SELECT ... FOR UPDATE`),
        numeração rigorosamente sequencial, cálculo automático de IVA a 14% ou isenções
        (M00-M99), encadeamento de hash SHA-256 e assinatura digital RSA 2048-bit
        nos termos do Decreto Presidencial n.º 71/25.

        '
      tags:
      - Facturação & Motor Fiscal
      security:
      - BearerAuth: []
        TenantHeader: []
      parameters:
      - $ref: '#/components/parameters/TenantHeader'
      - $ref: '#/components/parameters/IdempotencyKeyHeader'
      - $ref: '#/components/parameters/CorrelationIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IssueInvoiceRequest'
            example:
              tenantId: a0000000-0000-0000-0000-000000000001
              documentType: FT
              seriesCode: KUD26
              fiscalYear: 2026
              customerName: Empresa de Transportes Sonangol EP
              customerNif: '5412345678'
              currency: AOA
              lines:
              - productCode: PROD-001
                description: Licenciamento Kudiba ERP Cloud Anual
                quantity: 1
                unitPrice: 500000.0
                taxRate: 14.0
              - productCode: SERV-002
                description: Consultoria e Parametrização Fiscal AGT
                quantity: 10
                unitPrice: 25000.0
                taxRate: 14.0
      responses:
        '201':
          description: Documento fiscal emitido, assinado digitalmente e gravado com
            sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssueInvoiceResponse'
              example:
                invoiceId: 9c68dc2d-c1d8-4e5b-9a09-3794af2b549a
                documentNumber: FT KUD26/000001
                sequenceNumber: 1
                netTotal: 750000.0
                taxTotal: 105000.0
                grossTotal: 855000.0
                hashSha256: 5e0af1859bb4a4c170fd3ec53980df5b4623277c59e88a7bab1e18795f5366da
                signatureRsaBase64: 
                validationChars: etwU
                issuedAt: '2026-10-03T00:00:00Z'
                systemEntryDate: '2026-10-03T10:11:11.1753844Z'
                isContingency: false
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '423':
          description: Bloqueio legal de contingência AGT (limite de 60 dias sem comunicação
            excedido)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /api/v1/invoices/{id}:
    get:
      summary: Consultar Fatura por ID
      description: Recupera os dados completos da fatura emitida, incluindo as linhas
        de artigo e o bloco de assinatura digital.
      tags:
      - Facturação & Motor Fiscal
      security:
      - BearerAuth: []
        TenantHeader: []
      parameters:
      - name: id
        in: path
        required: true
        description: Identificador UUID v4 da fatura
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/TenantHeader'
      - $ref: '#/components/parameters/CorrelationIdHeader'
      responses:
        '200':
          description: Detalhes completos da fatura
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceDetailResponse'
        '404':
          description: Fatura não encontrada
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Invoice not found.
  /api/v1/fiscal/public-key:
    get:
      summary: Obter Chave Pública RSA da AGT
      description: Retorna a chave pública RSA 2048-bit registrada para validação
        independente das assinaturas digitais dos documentos emitidos.
      tags:
      - Facturação & Motor Fiscal
      security:
      - BearerAuth: []
        TenantHeader: []
      parameters:
      - $ref: '#/components/parameters/TenantHeader'
      - $ref: '#/components/parameters/CorrelationIdHeader'
      responses:
        '200':
          description: Chave pública e metadados de criptografia
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicKeyResponse'
  /health:
    get:
      summary: Verificação de Vida (Liveness Probe)
      description: Retorna o estado de integridade do processo do API Gateway.
      tags:
      - Observabilidade & Infraestrutura
      responses:
        '200':
          description: Gateway operacional
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                status: UP
                timestamp: '2026-10-03T12:00:00.000Z'
  /ready:
    get:
      summary: Verificação de Prontidão (Readiness Probe)
      description: Valida a conectividade ativa entre o API Gateway e a camada de
        estado e cache (Redis 7+).
      tags:
      - Observabilidade & Infraestrutura
      responses:
        '200':
          description: Gateway e Redis operacionais
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyResponse'
        '503':
          description: Conexão perimétrica indisponível (Gateway ou Redis fora de
            serviço)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyResponse'
  /health/services:
    get:
      summary: Diagnóstico de Saúde de Todos os Serviços do Cluster
      description: 'Realiza sondagens assíncronas concorrentes de integridade e latência
        em tempo real contra todos os componentes do cluster Kudiba: Redis, Motor
        Fiscal (KudibaInvoicing / Decreto 71/25), PostgreSQL, RabbitMQ, Core API e
        Webservices da AGT. O estado da AGT é reportado pelo Motor Fiscal (único autorizado
        a contactar o canal governamental) e o relatório é memoizado durante 5 segundos.
        Devolve 503 quando um serviço crítico (Redis, PostgreSQL ou Motor Fiscal)
        está indisponível.

        Requer JWT válido: o relatório expõe hostnames e portas internas do cluster.

        '
      tags:
      - Observabilidade & Infraestrutura
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Diagnóstico concluído (status do cluster HEALTHY ou DEGRADED)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemHealthResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '503':
          description: Serviços essenciais indisponíveis (cluster UNHEALTHY)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemHealthResponse'
  /status:
    get:
      summary: Alias do Diagnóstico de Saúde de Serviços
      description: Rota alternativa compatível com orquestradores e painéis de observabilidade
        para /health/services.
      tags:
      - Observabilidade & Infraestrutura
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Diagnóstico concluído
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemHealthResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '503':
          description: Serviços essenciais indisponíveis (cluster UNHEALTHY)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemHealthResponse'
  /metrics:
    get:
      summary: Métricas de Observabilidade (Prometheus)
      description: Exporta métricas de tráfego, latência e requisições HTTP no padrão
        Prometheus.
      tags:
      - Observabilidade & Infraestrutura
      responses:
        '200':
          description: Métricas no formato Prometheus
          content:
            text/plain:
              schema:
                type: string
  /api-docs/openapi.yaml:
    get:
      summary: Especificação OpenAPI 3.1 Bruta (YAML)
      description: Retorna o manifesto YAML da especificação do Gateway atualmente
        em vigor.
      tags:
      - Observabilidade & Infraestrutura
      responses:
        '200':
          description: Arquivo YAML da especificação OpenAPI
          content:
            application/yaml:
              schema:
                type: string
  /api-docs/openapi.json:
    get:
      summary: Especificação OpenAPI 3.1 Unificada (Gateway + KudibaAuth)
      description: 'Retorna o documento OpenAPI 3.1 em JSON que agrega as rotas do
        Gateway, do Motor Fiscal (KudibaInvoicing) e do microsserviço KudibaAuth,
        sendo a fonte consumida pela Scalar API Reference.

        '
      tags:
      - Observabilidade & Infraestrutura
      responses:
        '200':
          description: Documento OpenAPI unificado em JSON
          content:
            application/json:
              schema:
                type: object
  /api/v1/inventory/products:
    post:
      summary: Criar Artigo, Mercadoria ou Serviço
      description: Regista um novo artigo no catálogo da empresa. Para serviços (tipo
        'S'), 'is_stockable' é desativado por omissão e retenção na fonte a 6.5% é
        ativada.
      tags:
      - Inventário & Catálogo
      security:
      - BearerAuth: []
        TenantHeader: []
      parameters:
      - $ref: '#/components/parameters/TenantHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProductRequest'
      responses:
        '201':
          description: Artigo criado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
    get:
      summary: Listar Catálogo de Artigos
      description: Retorna a lista paginada de artigos e serviços cadastrados na empresa.
      tags:
      - Inventário & Catálogo
      security:
      - BearerAuth: []
        TenantHeader: []
      parameters:
      - $ref: '#/components/parameters/TenantHeader'
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: 50
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          default: 0
      responses:
        '200':
          description: Lista de artigos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProductResponse'
  /api/v1/inventory/products/{id}:
    get:
      summary: Obter Artigo por ID
      description: Retorna os detalhes cadastrais e tributários de um artigo por UUID.
      tags:
      - Inventário & Catálogo
      security:
      - BearerAuth: []
        TenantHeader: []
      parameters:
      - $ref: '#/components/parameters/TenantHeader'
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Detalhes do artigo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '404':
          description: Artigo não encontrado
    put:
      summary: Atualizar Dados Cadastrais do Artigo
      description: Atualiza os dados cadastrais, tributários ou estado ativo do artigo.
      tags:
      - Inventário & Catálogo
      security:
      - BearerAuth: []
        TenantHeader: []
      parameters:
      - $ref: '#/components/parameters/TenantHeader'
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProductRequest'
      responses:
        '200':
          description: Artigo atualizado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
  /api/v1/inventory/products/{id}/price:
    patch:
      summary: Atualizar Preços do Artigo
      description: Atualiza o preço de venda e opcionalmente o preço de custo do artigo.
      tags:
      - Inventário & Catálogo
      security:
      - BearerAuth: []
        TenantHeader: []
      parameters:
      - $ref: '#/components/parameters/TenantHeader'
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProductPriceRequest'
      responses:
        '200':
          description: Preços atualizados
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
  /api/v1/inventory/products/by-code/{code}:
    get:
      summary: Obter Artigo por Código SKU
      description: Retorna o artigo a partir do código interno / SKU.
      tags:
      - Inventário & Catálogo
      security:
      - BearerAuth: []
        TenantHeader: []
      parameters:
      - $ref: '#/components/parameters/TenantHeader'
      - name: code
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Detalhes do artigo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
  /api/v1/inventory/entities:
    post:
      summary: Registar Cliente ou Fornecedor
      description: Cadastra entidade comercial validando NIF angolano conforme regras
        da AGT (Pessoa Coletiva com 10 dígitos, BI singular, Consumidor Final 999999999
        ou Estrangeiro).
      tags:
      - Entidades Comerciais
      security:
      - BearerAuth: []
        TenantHeader: []
      parameters:
      - $ref: '#/components/parameters/TenantHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterEntityRequest'
      responses:
        '201':
          description: Entidade registada com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntityResponse'
    get:
      summary: Listar Entidades Comerciais
      description: Lista clientes e fornecedores cadastrados na empresa.
      tags:
      - Entidades Comerciais
      security:
      - BearerAuth: []
        TenantHeader: []
      parameters:
      - $ref: '#/components/parameters/TenantHeader'
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: 50
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          default: 0
      responses:
        '200':
          description: Lista de entidades
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EntityResponse'
  /api/v1/inventory/entities/{id}:
    get:
      summary: Obter Entidade Comercial por ID
      description: Retorna a ficha cadastral do cliente ou fornecedor por UUID.
      tags:
      - Entidades Comerciais
      security:
      - BearerAuth: []
        TenantHeader: []
      parameters:
      - $ref: '#/components/parameters/TenantHeader'
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Dados da entidade
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntityResponse'
    put:
      summary: Atualizar Entidade Comercial
      description: Atualiza os dados de contacto, morada, retenção ou estado da entidade.
      tags:
      - Entidades Comerciais
      security:
      - BearerAuth: []
        TenantHeader: []
      parameters:
      - $ref: '#/components/parameters/TenantHeader'
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateEntityRequest'
      responses:
        '200':
          description: Entidade atualizada com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntityResponse'
  /api/v1/inventory/entities/by-tax-id/{tax_id}:
    get:
      summary: Consultar Entidade por NIF / BI
      description: Busca rápida para autopreenchimento de cliente no POS ou faturamento.
      tags:
      - Entidades Comerciais
      security:
      - BearerAuth: []
        TenantHeader: []
      parameters:
      - $ref: '#/components/parameters/TenantHeader'
      - name: tax_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Dados da entidade
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntityResponse'
  /api/v1/inventory/warehouses:
    post:
      summary: Registar Armazém
      description: Cria um armazém físico vinculado à filial e empresa.
      tags:
      - Armazéns & Logística
      security:
      - BearerAuth: []
        TenantHeader: []
      parameters:
      - $ref: '#/components/parameters/TenantHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWarehouseRequest'
      responses:
        '201':
          description: Armazém criado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WarehouseResponse'
    get:
      summary: Listar Armazéns da Empresa
      description: Retorna os armazéns registados para o tenant autenticado.
      tags:
      - Armazéns & Logística
      security:
      - BearerAuth: []
        TenantHeader: []
      parameters:
      - $ref: '#/components/parameters/TenantHeader'
      responses:
        '200':
          description: Lista de armazéns
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WarehouseResponse'
  /api/v1/inventory/warehouses/{id}:
    get:
      summary: Obter Armazém por ID
      description: Retorna os detalhes de um armazém específico.
      tags:
      - Armazéns & Logística
      security:
      - BearerAuth: []
        TenantHeader: []
      parameters:
      - $ref: '#/components/parameters/TenantHeader'
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Detalhes do armazém
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WarehouseResponse'
    put:
      summary: Atualizar Armazém
      description: Atualiza nome, localização ou status padrão do armazém.
      tags:
      - Armazéns & Logística
      security:
      - BearerAuth: []
        TenantHeader: []
      parameters:
      - $ref: '#/components/parameters/TenantHeader'
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateWarehouseRequest'
      responses:
        '200':
          description: Armazém atualizado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WarehouseResponse'
  /api/v1/inventory/batches:
    post:
      summary: Registar Lote de Artigo
      description: Cadastra um novo lote com número de série e datas de fabrico e
        validade para artigos com controlo de lotes.
      tags:
      - Lotes & Validades
      security:
      - BearerAuth: []
        TenantHeader: []
      parameters:
      - $ref: '#/components/parameters/TenantHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBatchRequest'
      responses:
        '201':
          description: Lote criado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchResponse'
  /api/v1/inventory/batches/{id}:
    get:
      summary: Obter Lote por ID
      description: Retorna os detalhes e validade do lote.
      tags:
      - Lotes & Validades
      security:
      - BearerAuth: []
        TenantHeader: []
      parameters:
      - $ref: '#/components/parameters/TenantHeader'
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Detalhes do lote
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchResponse'
  /api/v1/inventory/products/{product_id}/batches:
    get:
      summary: Listar Lotes de um Artigo
      description: Retorna todos os lotes cadastrados para o produto informado.
      tags:
      - Lotes & Validades
      security:
      - BearerAuth: []
        TenantHeader: []
      parameters:
      - $ref: '#/components/parameters/TenantHeader'
      - name: product_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Lista de lotes do artigo
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BatchResponse'
  /api/v1/inventory/movements:
    get:
      summary: Listar Movimentações de Stock
      description: Retorna o histórico de auditoria de movimentos de stock com filtros
        opcionais por produto e armazém.
      tags:
      - Movimentos de Stock & CMP
      security:
      - BearerAuth: []
        TenantHeader: []
      parameters:
      - $ref: '#/components/parameters/TenantHeader'
      - name: product_id
        in: query
        required: false
        schema:
          type: string
          format: uuid
      - name: warehouse_id
        in: query
        required: false
        schema:
          type: string
          format: uuid
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: 50
      responses:
        '200':
          description: Histórico de movimentos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StockMovementResponse'
  /api/v1/inventory/movements/purchase:
    post:
