          type: string
        target_routing_key:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    CreateIntegrationMappingRequest:
      type: object
      required: [name, entity_type, target_event_type, target_routing_key]
      properties:
        name:
          type: string
        entity_type:
          type: string
          example: attendance
        target_event_type:
          type: string
          example: attendance.recorded
        target_routing_key:
          type: string
          example: payroll.event.attendance.recorded
        is_enabled:
          type: boolean
          default: true
        record_path:
          type: string
          example: data.records
        field_mappings:
          type: array
          description: Lista de especificações de mapeamento (target/source/type/format/transform/value_map...).
          items:
            type: object
            additionalProperties: true
        static_payload:
          type: object
          additionalProperties: true
        dedup_fields:
          type: array
          items: { type: string }
        conflict_policy:
          type: string
          enum: [SKIP, UPDATE, FAIL]
          default: SKIP
    IntegrationRun:
      type: object
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        endpoint_id:
          type: string
          format: uuid
        mapping_id:
          type: string
          format: uuid
          nullable: true
