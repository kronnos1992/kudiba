        connector_type:
          type: string
          enum: [WEBHOOK, REST_PULL, FILE_IMPORT]
        description:
          type: string
        is_enabled:
          type: boolean
          default: true
        auth_type:
          type: string
          enum: [NONE, API_KEY, BASIC, BEARER]
          default: NONE
        credentials:
          type: object
          additionalProperties: true
        webhook_header_name:
          type: string
        webhook_secret:
          type: string
        source_url:
          type: string
        http_method:
          type: string
          default: GET
        request_headers:
          type: object
          additionalProperties: true
        query_params:
          type: object
          additionalProperties: true
        schedule_interval_seconds:
          type: integer
        data_format:
          type: string
          enum: [JSON, CSV, FIXED_WIDTH]
          default: JSON
        file_delimiter:
          type: string
        file_has_header:
          type: boolean
          default: true
        file_encoding:
          type: string
          default: utf-8
        column_widths:
          type: array
          items:
            type: object
            additionalProperties: true
