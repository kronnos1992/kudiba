      - $ref: '#/components/parameters/TenantHeader'
      - name: mapping_id
        in: path
        required: true
        schema: { type: string, format: uuid }
      responses:
        '204':
          description: Mapeamento removido
  /api/v1/integrations/runs:
    get:
      summary: Listar execuções de integração (auditoria)
      tags: [Integrações]
      security:
      - BearerAuth: []
        TenantHeader: []
      parameters:
      - $ref: '#/components/parameters/TenantHeader'
      - name: endpoint_id
        in: query
        schema: { type: string, format: uuid }
      - name: limit
        in: query
        schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        '200':
          description: Lista de execuções
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/IntegrationRun' }
  /api/v1/integrations/webhooks/{webhook_key}:
    post:
      summary: Receber webhook de sistema externo (público)
      description: Endpoint público consumido por sistemas externos. Não requer JWT.
      tags: [Integrações]
      parameters:
      - name: webhook_key
        in: path
        required: true
        schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '202':
          description: Webhook aceite para processamento
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebhookAccepted' }
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'Token JWT emitido pelo Kudiba contendo claims de utilizador e
        tenant. Insira o token diretamente no campo abaixo.

        '
    TenantHeader:
      type: apiKey
      in: header
      name: X-Tenant-ID
      description: Identificador do Tenant (UUID v4), ex `a0000000-0000-0000-0000-000000000001`.
  schemas:
    IssueInvoiceRequest:
      type: object
      required:
      - tenantId
      - documentType
      - seriesCode
      - fiscalYear
      - customerName
      - lines
      properties:
        tenantId:
          type: string
          format: uuid
          description: Identificador único da empresa/organização emissora
        documentType:
          type: string
          enum:
          - FT
          - FR
          - FP
          - NC
          - ND
          - RC
          - GR
          - GT
          description: Tipo de documento fiscal nos termos da AGT
          example: FT
        seriesCode:
          type: string
          description: Código identificador da série documental (ex. KUD26, A, SEDE)
          example: KUD26
        fiscalYear:
          type: integer
          description: Ano fiscal de emissão
          example: 2026
        customerName:
          type: string
          description: Nome ou razão social do adquirente
          example: Empresa de Transportes Sonangol EP
        customerNif:
          type: string
          description: NIF do adquirente ou 'Consumidor Final'
          default: Consumidor Final
          example: '5412345678'
        currency:
          type: string
          default: AOA
          example: AOA
        isContingency:
          type: boolean
          default: false
        keyVersion:
          type: string
          default: '1'
        lines:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/InvoiceLineInput'
    InvoiceLineInput:
      type: object
      required:
      - productCode
      - description
      - quantity
      - unitPrice
      - taxRate
      properties:
        productCode:
          type: string
          example: PROD-001
        description:
          type: string
          example: Licenciamento Kudiba ERP Cloud Anual
        quantity:
          type: number
          format: double
          example: 1.0
        unitPrice:
          type: number
          format: double
          example: 500000.0
        taxRate:
          type: number
          format: double
          description: Taxa de IVA aplicada em percentagem (ex. 14.00, 5.00, 0.00)
          example: 14.0
        taxExemptionCode:
          type: string
          nullable: true
          description: Motivo legal de isenção AGT (M00 a M99) obrigatório se a taxa
            de IVA for 0%
          example: null
    IssueInvoiceResponse:
      type: object
      properties:
        invoiceId:
          type: string
          format: uuid
        documentNumber:
          type: string
          example: FT KUD26/000001
        sequenceNumber:
          type: integer
          example: 1
        netTotal:
          type: number
          format: double
          example: 750000.0
        taxTotal:
          type: number
          format: double
          example: 105000.0
        grossTotal:
          type: number
          format: double
          example: 855000.0
        hashSha256:
          type: string
          description: Hash SHA-256 gerado pelo encadeamento criptográfico do Decreto
            n.º 71/25
        signatureRsaBase64:
          type: string
          description: Assinatura digital RSA 2048-bit em Base64
        validationChars:
          type: string
          description: Os 4 caracteres de validação impressos no documento (posições
            1, 11, 21, 31)
          example: etwU
        issuedAt:
          type: string
          format: date-time
        systemEntryDate:
          type: string
          format: date-time
        isContingency:
          type: boolean
    InvoiceDetailResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        seriesId:
          type: string
          format: uuid
        documentNumber:
          type: string
        sequenceNumber:
          type: integer
        documentType:
          type: string
        customerName:
          type: string
        customerNif:
          type: string
        currency:
          type: string
        netTotal:
          type: number
        taxTotal:
          type: number
        grossTotal:
          type: number
        hashSha256:
          type: string
        signatureRsaBase64:
          type: string
        validationChars:
          type: string
        keyVersion:
          type: string
        isContingency:
          type: boolean
        issuedAt:
          type: string
          format: date-time
        systemEntryDate:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        lines:
          type: array
          items:
            $ref: '#/components/schemas/InvoiceLineDetail'
    InvoiceLineDetail:
      type: object
      properties:
        id:
          type: string
          format: uuid
        invoiceId:
          type: string
          format: uuid
        lineNumber:
          type: integer
        productCode:
          type: string
        description:
          type: string
        quantity:
          type: number
        unitPrice:
          type: number
        taxRate:
          type: number
        taxExemptionCode:
          type: string
          nullable: true
        lineTotal:
          type: number
    PublicKeyResponse:
      type: object
      properties:
        keyVersion:
          type: string
          example: '1'
        publicKeyPem:
          type: string
          example: '-----BEGIN PUBLIC KEY-----

            MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8A...'
        algorithm:
          type: string
          example: RSA-2048 / SHA-256 PKCS#1 v1.5
    HealthResponse:
      type: object
      required:
      - status
      - timestamp
      properties:
        status:
          type: string
          example: UP
        timestamp:
          type: string
          format: date-time
    ReadyResponse:
      type: object
      required:
      - status
      properties:
        status:
          type: string
          example: READY
        redis:
          type: string
          example: CONNECTED
    SystemHealthResponse:
      type: object
      required:
      - status
      - timestamp
      - gateway
      - services
      - summary
      properties:
        status:
          type: string
          enum:
          - HEALTHY
          - DEGRADED
          - UNHEALTHY
          example: HEALTHY
        timestamp:
          type: string
          format: date-time
        gateway:
          type: object
          properties:
            version:
              type: string
              example: 1.0.0
            environment:
              type: string
              example: development
            port:
              type: integer
              example: 8080
            uptimeSeconds:
              type: integer
              example: 120
        services:
          type: array
          items:
            type: object
            required:
            - name
            - serviceType
            - status
            - endpoint
            - latencyMs
            properties:
              name:
                type: string
                example: Motor Fiscal (KudibaInvoicing)
              serviceType:
                type: string
                example: FISCAL_ENGINE
              status:
                type: string
                enum:
                - HEALTHY
                - DEGRADED
                - UNAVAILABLE
                example: HEALTHY
              endpoint:
                type: string
                example: http://fiscal-engine:9090
              latencyMs:
                type: integer
                example: 8
              message:
                type: string
              details:
                type: object
        summary:
          type: object
          properties:
            total:
              type: integer
              example: 6
            healthy:
              type: integer
              example: 5
            degraded:
              type: integer
              example: 1
            unavailable:
              type: integer
              example: 0
    ProblemDetail:
      type: object
      required:
      - type
      - title
      - status
      - detail
      - instance
      - code
      - timestamp
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
