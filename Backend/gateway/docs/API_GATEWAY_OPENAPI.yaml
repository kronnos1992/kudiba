openapi: 3.1.0
info:
  title: Kudiba ERP - API Gateway & Motor Fiscal
  version: 1.0.0
  description: >
    API Gateway de entrada e orquestração perimétrica do ERP Kudiba em Rust, integrado
    com o microserviço de facturação e motor fiscal KudibaInvoicing (Rust / Axum + Tonic).
    
    ### Conformidade Regulatória
    Conforme o **Decreto Presidencial n.º 71/25 de Angola (AGT)**:
    - Assinatura digital RSA 2048-bit PKCS#1 v1.5 com encadeamento de hash SHA-256.
    - 4 caracteres de controlo extraídos das posições 1ª, 11ª, 21ª e 31ª da assinatura.
    - Bloqueio pessimista por série fiscal garantindo sequencialidade estrita sem lacunas (*zero gaps*).
    - Imutabilidade de faturas com trigger no PostgreSQL.

    ### Autenticação no Swagger
    Clique no botão verde **Authorize** no topo direito e insira:
    1. **BearerAuth:** `Bearer <token>` (ou apenas `<token>`).
       - Token de Desenvolvimento Pré-Gerado (válido para testes locais):
       `eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiJ1c2VyLWFkbWluLWRlbW8iLCJ0ZW5hbnRfaWQiOiJhMDAwMDAwMC0wMDAwLTAwMDAtMDAwMC0wMDAwMDAwMDAwMDEiLCJicmFuY2hfaWQiOiJzZWRlLWx1YW5kYSIsInJvbGVzIjpbIkFETUlOIiwiT1BFUkFUT1IiLCJGSVNDQUxfQVVESVRPUiJdLCJleHAiOjIwODk4ODE2MDAsImp0aSI6ImRldi10b2tlbi1rdWRpYmEtMjAyNiJ9.6cn5UXJeLTv3tRFBq-6xOFK3_LtgBtpTI41ppXcGcR0`
    2. **TenantHeader:** `a0000000-0000-0000-0000-000000000001`
  contact:
    name: Equipa de Engenharia Kudiba
    email: engenharia@kudiba.ao

servers:
  - url: http://localhost:8080
    description: API Gateway Local (Desenvolvimento / Docker)
  - url: http://localhost:9090
    description: KudibaInvoicing Direto (Rust - Sem Middlewares de Gateway)

paths:
  # =========================================================================
  # FACTURAÇÃO & MOTOR FISCAL (AGT ANGOLA)
  # =========================================================================
  /api/v1/invoices:
    post:
      summary: Emitir Fatura / Documento Fiscal com Assinatura Digital AGT
      description: >
        Emite um novo documento com relevância fiscal (FT, FR, NC, ND) com bloqueio pessimista
        atômico da série fiscal (`SELECT ... FOR UPDATE`), numeração rigorosamente sequencial,
        cálculo automático de IVA a 14% ou isenções (M00-M99), encadeamento de hash SHA-256 e
        assinatura digital RSA 2048-bit nos termos do Decreto Presidencial n.º 71/25.
      tags:
        - Facturação & Motor Fiscal
      security:
        - BearerAuth: []
          TenantHeader: []
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
        - $ref: '#/components/parameters/CorrelationIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IssueInvoiceRequest'
            example:
              tenantId: "a0000000-0000-0000-0000-000000000001"
              documentType: "FT"
              seriesCode: "KUD26"
              fiscalYear: 2026
              customerName: "Empresa de Transportes Sonangol EP"
              customerNif: "5412345678"
              currency: "AOA"
              lines:
                - productCode: "PROD-001"
                  description: "Licenciamento Kudiba ERP Cloud Anual"
                  quantity: 1
                  unitPrice: 500000.00
                  taxRate: 14.00
                - productCode: "SERV-002"
                  description: "Consultoria e Parametrização Fiscal AGT"
                  quantity: 10
                  unitPrice: 25000.00
                  taxRate: 14.00
      responses:
        '201':
          description: Documento fiscal emitido, assinado digitalmente e gravado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssueInvoiceResponse'
              example:
                invoiceId: "9c68dc2d-c1d8-4e5b-9a09-3794af2b549a"
                documentNumber: "FT KUD26/000001"
                sequenceNumber: 1
                netTotal: 750000.00
                taxTotal: 105000.00
                grossTotal: 855000.00
                hashSha256: "5e0af1859bb4a4c170fd3ec53980df5b4623277c59e88a7bab1e18795f5366da"
                signatureRsaBase64: ""
                validationChars: "etwU"
                issuedAt: "2026-10-03T00:00:00Z"
                systemEntryDate: "2026-10-03T10:11:11.1753844Z"
                isContingency: false
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '423':
          description: Bloqueio legal de contingência AGT (limite de 60 dias sem comunicação excedido)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /api/v1/invoices/{id}:
    get:
      summary: Consultar Fatura por ID
      description: Recupera os dados completos da fatura emitida, incluindo as linhas de artigo e o bloco de assinatura digital.
      tags:
        - Facturação & Motor Fiscal
      security:
        - BearerAuth: []
          TenantHeader: []
      parameters:
        - name: id
          in: path
          required: true
          description: Identificador UUID v4 da fatura
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/CorrelationIdHeader'
      responses:
        '200':
          description: Detalhes completos da fatura
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceDetailResponse'
        '404':
          description: Fatura não encontrada
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Invoice not found."

  /api/v1/fiscal/public-key:
    get:
      summary: Obter Chave Pública RSA da AGT
      description: Retorna a chave pública RSA 2048-bit registrada para validação independente das assinaturas digitais dos documentos emitidos.
      tags:
        - Facturação & Motor Fiscal
      security:
        - BearerAuth: []
          TenantHeader: []
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/CorrelationIdHeader'
      responses:
        '200':
          description: Chave pública e metadados de criptografia
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicKeyResponse'

  # =========================================================================
  # OBSERVABILIDADE & INFRAESTRUTURA
  # =========================================================================
  /health:
    get:
      summary: Verificação de Vida (Liveness Probe)
      description: Retorna o estado de integridade do processo do API Gateway.
      tags:
        - Observabilidade & Infraestrutura
      responses:
        '200':
          description: Gateway operacional
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                status: "UP"
                timestamp: "2026-10-03T12:00:00.000Z"

  /ready:
    get:
      summary: Verificação de Prontidão (Readiness Probe)
      description: Valida a conectividade ativa entre o API Gateway e a camada de estado e cache (Redis 7+).
      tags:
        - Observabilidade & Infraestrutura
      responses:
        '200':
          description: Gateway e Redis operacionais
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyResponse'
        '503':
          description: Conexão perimétrica indisponível (Gateway ou Redis fora de serviço)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyResponse'

  /health/services:
    get:
      summary: Diagnóstico de Saúde de Todos os Serviços do Cluster
      description: >
        Realiza sondagens assíncronas concorrentes de integridade e latência em tempo real
        contra todos os componentes do cluster Kudiba: Redis, Motor Fiscal (KudibaInvoicing /
        Decreto 71/25), PostgreSQL, RabbitMQ, Core API e Webservices da AGT. O estado da AGT é
        reportado pelo Motor Fiscal (único autorizado a contactar o canal governamental) e o
        relatório é memoizado durante 5 segundos. Devolve 503 quando um serviço crítico
        (Redis, PostgreSQL ou Motor Fiscal) está indisponível.

        Requer JWT válido: o relatório expõe hostnames e portas internas do cluster.
      tags:
        - Observabilidade & Infraestrutura
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Diagnóstico concluído (status do cluster HEALTHY ou DEGRADED)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemHealthResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '503':
          description: Serviços essenciais indisponíveis (cluster UNHEALTHY)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemHealthResponse'

  /status:
    get:
      summary: Alias do Diagnóstico de Saúde de Serviços
      description: Rota alternativa compatível com orquestradores e painéis de observabilidade para /health/services.
      tags:
        - Observabilidade & Infraestrutura
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Diagnóstico concluído
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemHealthResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '503':
          description: Serviços essenciais indisponíveis (cluster UNHEALTHY)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemHealthResponse'

  /metrics:
    get:
      summary: Métricas de Observabilidade (Prometheus)
      description: Exporta métricas de tráfego, latência e requisições HTTP no padrão Prometheus.
      tags:
        - Observabilidade & Infraestrutura
      responses:
        '200':
          description: Métricas no formato Prometheus
          content:
            text/plain:
              schema:
                type: string

  /api-docs/openapi.yaml:
    get:
      summary: Especificação OpenAPI 3.1 Bruta
      description: Retorna o manifesto YAML completo da especificação da API atualmente em vigor.
      tags:
        - Observabilidade & Infraestrutura
      responses:
        '200':
          description: Arquivo YAML da especificação OpenAPI
          content:
            application/yaml:
              schema:
                type: string

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        Token JWT emitido pelo Kudiba contendo claims de utilizador e tenant.
        Insira o token diretamente no campo abaixo.
    TenantHeader:
      type: apiKey
      in: header
      name: X-Tenant-ID
      description: Identificador do Tenant (UUID v4), ex `a0000000-0000-0000-0000-000000000001`.

  schemas:
    IssueInvoiceRequest:
      type: object
      required:
        - tenantId
        - documentType
        - seriesCode
        - fiscalYear
        - customerName
        - lines
      properties:
        tenantId:
          type: string
          format: uuid
          description: Identificador único da empresa/organização emissora
        documentType:
          type: string
          enum: [FT, FR, FP, NC, ND, RC, GR, GT]
          description: Tipo de documento fiscal nos termos da AGT
          example: "FT"
        seriesCode:
          type: string
          description: Código identificador da série documental (ex. KUD26, A, SEDE)
          example: "KUD26"
        fiscalYear:
          type: integer
          description: Ano fiscal de emissão
          example: 2026
        customerName:
          type: string
          description: Nome ou razão social do adquirente
          example: "Empresa de Transportes Sonangol EP"
        customerNif:
          type: string
          description: NIF do adquirente ou 'Consumidor Final'
          default: "Consumidor Final"
          example: "5412345678"
        currency:
          type: string
          default: "AOA"
          example: "AOA"
        isContingency:
          type: boolean
          default: false
        keyVersion:
          type: string
          default: "1"
        lines:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/InvoiceLineInput'

    InvoiceLineInput:
      type: object
      required:
        - productCode
        - description
        - quantity
        - unitPrice
        - taxRate
      properties:
        productCode:
          type: string
          example: "PROD-001"
        description:
          type: string
          example: "Licenciamento Kudiba ERP Cloud Anual"
        quantity:
          type: number
          format: double
          example: 1.0
        unitPrice:
          type: number
          format: double
          example: 500000.00
        taxRate:
          type: number
          format: double
          description: Taxa de IVA aplicada em percentagem (ex. 14.00, 5.00, 0.00)
          example: 14.00
        taxExemptionCode:
          type: string
          nullable: true
          description: Motivo legal de isenção AGT (M00 a M99) obrigatório se a taxa de IVA for 0%
          example: null

    IssueInvoiceResponse:
      type: object
      properties:
        invoiceId:
          type: string
          format: uuid
        documentNumber:
          type: string
          example: "FT KUD26/000001"
        sequenceNumber:
          type: integer
          example: 1
        netTotal:
          type: number
          format: double
          example: 750000.00
        taxTotal:
          type: number
          format: double
          example: 105000.00
        grossTotal:
          type: number
          format: double
          example: 855000.00
        hashSha256:
          type: string
          description: Hash SHA-256 gerado pelo encadeamento criptográfico do Decreto n.º 71/25
        signatureRsaBase64:
          type: string
          description: Assinatura digital RSA 2048-bit em Base64
        validationChars:
          type: string
          description: Os 4 caracteres de validação impressos no documento (posições 1, 11, 21, 31)
          example: "etwU"
        issuedAt:
          type: string
          format: date-time
        systemEntryDate:
          type: string
          format: date-time
        isContingency:
          type: boolean

    InvoiceDetailResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        seriesId:
          type: string
          format: uuid
        documentNumber:
          type: string
        sequenceNumber:
          type: integer
        documentType:
          type: string
        customerName:
          type: string
        customerNif:
          type: string
        currency:
          type: string
        netTotal:
          type: number
        taxTotal:
          type: number
        grossTotal:
          type: number
        hashSha256:
          type: string
        signatureRsaBase64:
          type: string
        validationChars:
          type: string
        keyVersion:
          type: string
        isContingency:
          type: boolean
        issuedAt:
          type: string
          format: date-time
        systemEntryDate:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        lines:
          type: array
          items:
            $ref: '#/components/schemas/InvoiceLineDetail'

    InvoiceLineDetail:
      type: object
      properties:
        id:
          type: string
          format: uuid
        invoiceId:
          type: string
          format: uuid
        lineNumber:
          type: integer
        productCode:
          type: string
        description:
          type: string
        quantity:
          type: number
        unitPrice:
          type: number
        taxRate:
          type: number
        taxExemptionCode:
          type: string
          nullable: true
        lineTotal:
          type: number

    PublicKeyResponse:
      type: object
      properties:
        keyVersion:
          type: string
          example: "1"
        publicKeyPem:
          type: string
          example: "-----BEGIN PUBLIC KEY-----\nMIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8A..."
        algorithm:
          type: string
          example: "RSA-2048 / SHA-256 PKCS#1 v1.5"

    HealthResponse:
      type: object
      required:
        - status
        - timestamp
      properties:
        status:
          type: string
          example: "UP"
        timestamp:
          type: string
          format: date-time

    ReadyResponse:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          example: "READY"
        redis:
          type: string
          example: "CONNECTED"

    SystemHealthResponse:
      type: object
      required:
        - status
        - timestamp
        - gateway
        - services
        - summary
      properties:
        status:
          type: string
          enum: [HEALTHY, DEGRADED, UNHEALTHY]
          example: "HEALTHY"
        timestamp:
          type: string
          format: date-time
        gateway:
          type: object
          properties:
            version:
              type: string
              example: "1.0.0"
            environment:
              type: string
              example: "development"
            port:
              type: integer
              example: 8080
            uptimeSeconds:
              type: integer
              example: 120
        services:
          type: array
          items:
            type: object
            required:
              - name
              - serviceType
              - status
              - endpoint
              - latencyMs
            properties:
              name:
                type: string
                example: "Motor Fiscal (KudibaInvoicing)"
              serviceType:
                type: string
                example: "FISCAL_ENGINE"
              status:
                type: string
                enum: [HEALTHY, DEGRADED, UNAVAILABLE]
                example: "HEALTHY"
              endpoint:
                type: string
                example: "http://fiscal-engine:9090"
              latencyMs:
                type: integer
                example: 8
              message:
                type: string
              details:
                type: object
        summary:
          type: object
          properties:
            total:
              type: integer
              example: 6
            healthy:
              type: integer
              example: 5
            degraded:
              type: integer
              example: 1
            unavailable:
              type: integer
              example: 0

    ProblemDetail:
      type: object
      required:
        - type
        - title
        - status
        - detail
        - instance
        - code
        - timestamp
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
        timestamp:
          type: string
          format: date-time

  parameters:
    CorrelationIdHeader:
      name: X-Correlation-ID
      in: header
      description: Identificador de rastreamento distribuído (propagado através dos serviços).
      required: false
      schema:
        type: string
        format: uuid

    TenantHeader:
      name: X-Tenant-ID
      in: header
      description: Identificador do Tenant (UUID v4) para orquestração multi-empresa.
      required: true
      schema:
        type: string
        format: uuid
        example: "a0000000-0000-0000-0000-000000000001"

    IdempotencyKeyHeader:
      name: Idempotency-Key
      in: header
      description: Chave de idempotência para prevenção de faturas duplicadas.
      required: false
      schema:
        type: string
        example: "fatura-venda-001"

  responses:
    BadRequestError:
      description: Requisição inválida ou parâmetros ausentes
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'

    UnauthorizedError:
      description: Autenticação ausente ou inválida
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
