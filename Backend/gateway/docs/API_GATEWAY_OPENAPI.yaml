components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'Token JWT emitido pelo Kudiba contendo claims de utilizador e
        tenant. Insira o token diretamente no campo abaixo.

        '
    TenantHeader:
      type: apiKey
      in: header
      name: X-Tenant-ID
      description: Identificador do Tenant (UUID v4), ex `a0000000-0000-0000-0000-000000000001`.
  schemas:
    IssueInvoiceRequest:
      type: object
      required:
      - tenantId
      - documentType
      - seriesCode
      - fiscalYear
      - customerName
      - lines
      properties:
        tenantId:
          type: string
          format: uuid
          description: Identificador único da empresa/organização emissora
        documentType:
          type: string
          enum:
          - FT
          - FR
          - FP
          - NC
          - ND
          - RC
          - GR
          - GT
          description: Tipo de documento fiscal nos termos da AGT
          example: FT
        seriesCode:
          type: string
          description: Código identificador da série documental (ex. KUD26, A, SEDE)
          example: KUD26
        fiscalYear:
          type: integer
          description: Ano fiscal de emissão
          example: 2026
        customerName:
          type: string
          description: Nome ou razão social do adquirente
          example: Empresa de Transportes Sonangol EP
        customerNif:
          type: string
          description: NIF do adquirente ou 'Consumidor Final'
          default: Consumidor Final
          example: '5412345678'
        currency:
          type: string
          default: AOA
          example: AOA
        isContingency:
          type: boolean
          default: false
        keyVersion:
          type: string
          default: '1'
        lines:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/InvoiceLineInput'
    InvoiceLineInput:
      type: object
      required:
      - productCode
      - description
      - quantity
      - unitPrice
      - taxRate
      properties:
