[package]
name = "kudiba-gateway"
version = "1.0.0"
edition = "2021"
authors = ["Equipa de Arquitetura Kudiba <engenharia@kudiba.ao>"]
description = "API Gateway de Alta Performance e Entrypoint Perimétrico do ERP Kudiba em Rust"

[dependencies]
# Web Framework e Runtime Assíncrono
axum = { version = "0.8.8", features = ["macros", "ws"] }
tokio = { version = "1.40", features = ["full"] }
tower = { version = "0.5", features = ["util", "timeout"] }
tower-http = { version = "0.5", features = ["cors", "trace", "limit", "timeout"] }

# Cliente HTTP de Alta Performance para Reverse Proxy
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
hyper = { version = "1.4", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
http-body-util = "0.1"

# Serialização e Tipos Auxiliares
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.10", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Camada de Estado Efêmero & Cache (Redis 7+)
redis = { version = "0.26", features = ["tokio-comp", "connection-manager", "aio"] }

# Criptografia, Tokens JWT e Segurança
jsonwebtoken = "9.3"

# Observabilidade, Métricas e Logs Estruturados
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Configuração e Variáveis de Ambiente
dotenvy = "0.15"


