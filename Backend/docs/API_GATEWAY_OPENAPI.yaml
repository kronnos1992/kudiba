openapi: 3.1.0
info:
  title: Kudiba ERP - API Gateway Entrypoint
  version: 1.0.0
  description: >
    API Gateway de entrada e orquestração perimétrica do ERP Kudiba.
    
    Esta especificação documenta com rigor os endpoints nativos atualmente
    desenvolvidos e operacionais no Gateway em Rust (Axum 0.8), incluindo
    sondas de liveness/readiness, métricas Prometheus e catálogo OpenAPI.
    
    À medida que os serviços de negócio (Core API e Motor Fiscal AGT) forem sendo
    desenvolvidos, os seus respectivos endpoints serão integrados e versionados aqui.
  contact:
    name: Equipa de Engenharia Kudiba
    email: engenharia@kudiba.ao

servers:
  - url: http://localhost:8080
    description: API Gateway Local (Desenvolvimento / Docker)

paths:
  # =========================================================================
  # OBSERVABILIDADE & INFRAESTRUTURA
  # =========================================================================
  /health:
    get:
      summary: Verificação de Vida (Liveness Probe)
      description: >
        Retorna o estado de integridade do processo do API Gateway.
        Utilizado pelo Docker, Kubernetes ou orquestradores de contêineres para liveness.
      tags:
        - Observabilidade & Infraestrutura
      responses:
        '200':
          description: O processo do Gateway está em execução ativa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                status: "UP"
                timestamp: "2026-10-03T08:50:00.000Z"

  /ready:
    get:
      summary: Verificação de Prontidão (Readiness Probe)
      description: >
        Valida a conectividade ativa entre o API Gateway e a camada de estado
        e cache efêmero (Redis 7+). Garante que o Gateway só receba tráfego
        externo quando todos os subsistemas perimétricos estiverem operacionais.
      tags:
        - Observabilidade & Infraestrutura
      responses:
        '200':
          description: Gateway e conexões perimétricas prontos para receber tráfego
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyResponse'
              example:
                status: "READY"
                redis: "CONNECTED"
        '503':
          description: Conexão perimétrica indisponível (modo degradado)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyResponse'
              example:
                status: "NOT_READY"
                redis: "DISCONNECTED"

  /metrics:
    get:
      summary: Métricas de Observabilidade (Prometheus)
      description: >
        Exporta métricas de tráfego, latência e requisições HTTP no padrão
        texto do Prometheus para consumo por agentes de monitorização e dashboards Grafana.
      tags:
        - Observabilidade & Infraestrutura
      responses:
        '200':
          description: Métricas no formato padrão de exportação Prometheus
          content:
            text/plain:
              schema:
                type: string
              example: |
                # HELP http_requests_total Total number of HTTP requests processed.
                # TYPE http_requests_total counter
                http_requests_total{status="200"} 124

  /api-docs/openapi.yaml:
    get:
      summary: Especificação OpenAPI 3.1 Bruta
      description: Retorna o manifesto YAML completo da especificação da API atualmente em vigor.
      tags:
        - Observabilidade & Infraestrutura
      responses:
        '200':
          description: Ficheiro YAML da especificação OpenAPI
          content:
            application/yaml:
              schema:
                type: string

components:
  schemas:
    HealthResponse:
      type: object
      required:
        - status
        - timestamp
      properties:
        status:
          type: string
          description: Estado do processo do Gateway
          enum: [UP, DOWN]
        timestamp:
          type: string
          format: date-time
          description: Carimbo temporal em formato ISO 8601 (UTC)

    ReadyResponse:
      type: object
      required:
        - status
        - redis
      properties:
        status:
          type: string
          description: Estado geral de prontidão
          enum: [READY, NOT_READY]
        redis:
          type: string
          description: Estado da ligação ao cluster Redis
          enum: [CONNECTED, DISCONNECTED]

    ProblemResponse:
      type: object
      description: Estrutura oficial de erro em conformidade com a RFC 7807 (Problem Details for HTTP APIs).
      required:
        - type
        - title
        - status
        - detail
        - instance
        - code
        - timestamp
      properties:
        type:
          type: string
          format: uri
          description: URI de referência que identifica o tipo do problema
        title:
          type: string
          description: Resumo curto e legível da falha
        status:
          type: integer
          description: Código de estado HTTP
        detail:
          type: string
          description: Explicação detalhada e contextualizada do erro
        instance:
          type: string
          description: URI da requisição que originou o erro
        code:
          type: string
          description: Código de erro da aplicação (ex. UPSTREAM_UNAVAILABLE)
        timestamp:
          type: string
          format: date-time
          description: Data e hora do registo do erro
        invalid_params:
          type: array
          description: Lista de parâmetros inválidos quando aplicável
          items:
            type: object
            properties:
              name:
                type: string
              reason:
                type: string

  parameters:
    CorrelationIdHeader:
      name: X-Correlation-ID
      in: header
      description: Identificador de correlação distribuído (propagado através de todos os saltos de rede).
      required: false
      schema:
        type: string
        format: uuid

    TenantHeader:
      name: X-Tenant-ID
      in: header
      description: Identificador do Tenant (UUID v4) para orquestração multi-empresa.
      required: false
      schema:
        type: string
        format: uuid

    IdempotencyKeyHeader:
      name: Idempotency-Key
      in: header
      description: Chave de idempotência (UUID v4) para prevenção de requisições duplicadas.
      required: false
      schema:
        type: string
        format: uuid

  headers:
    X-Correlation-ID:
      description: Identificador único da requisição para rastreabilidade de ponta a ponta.
      schema:
        type: string
        format: uuid
    X-RateLimit-Limit:
      description: Limite de requisições por janela temporal.
      schema:
        type: integer
    X-RateLimit-Remaining:
      description: Saldo de requisições restantes na janela atual.
      schema:
        type: integer
    X-RateLimit-Reset:
      description: Segundos restantes até à renovação da quota.
      schema:
        type: integer
