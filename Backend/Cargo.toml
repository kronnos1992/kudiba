[workspace]
resolver = "2"
members = [
    "gateway",
    "gateway_signature",
    "services/KudibaInvoicing",
    "services/KudibaInventory",
    "services/KudibaTreasury",
    "services/KudibaAccounting",
    "services/KudibaHardwareBridge",
]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
